 <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 – Không tìm thấy trang</title>
  <meta name="description" content="Trang 404 – Không tìm thấy nội dung bạn yêu cầu." />
  <style>
    :root {
  --bg: #f9fafb;
  --fg: #111827;
  --primary: #2563eb;
  --secondary: #4b5563;
  --danger: #dc2626;
  --radius: 0.75rem;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0 }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  display: flex;
  justify-content: center;
  padding: 2rem;
}

main.wrap {
  max-width: 900px;
  width: 100%;
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  padding: 2rem;
}

.badge {
  display: inline-block;
  background: var(--danger);
  color: #fff;
  font-weight: bold;
  padding: 0.25rem 0.75rem;
  border-radius: 999px;
  font-size: 0.9rem;
  margin-bottom: 1rem;
}

h1 {
  font-size: 1.8rem;
  margin-bottom: 1rem;
}

p.lead {
  color: var(--secondary);
  margin-bottom: 1.5rem;
}

form.search {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}

form.search input {
  flex: 1;
  padding: 0.6rem 0.8rem;
  border: 1px solid #d1d5db;
  border-radius: var(--radius);
}

.btn {
  padding: 0.6rem 1.2rem;
  border-radius: var(--radius);
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s;
}

.btn.primary {
  background: var(--primary);
  color: #fff;
}
.btn.primary:hover { background: #1d4ed8 }

.btn.ghost {
  background: transparent;
  border: 1px solid #d1d5db;
}
.btn.ghost:hover { background: #f3f4f6 }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
  margin-bottom: 1rem;
}

.code {
  font-family: monospace;
  background: #f3f4f6;
  padding: 0.2rem 0.4rem;
  border-radius: var(--radius);
}

.hint {
  font-size: 0.9rem;
  color: var(--secondary);
}

aside.art {
  display: flex;
  align-items: center;
  justify-content: center;
}

aside.art svg {
  max-width: 100%;
  height: auto;
}

footer {
  background: #f9fafb;
  padding: 1rem 2rem;
  font-size: 0.85rem;
  color: var(--secondary);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

@media (max-width: 768px) {
  .hero {
    grid-template-columns: 1fr;
  }
  aside.art { order: -1 }
}

  </style>
</head>
<body>
  <main class="wrap" role="main" aria-labelledby="title">
    <div class="hero">
      <section>
        <div class="badge" aria-hidden="true">⚠️ 404 – Not Found</div>
        <h1 id="title">Ôi không… Trang cậu tìm không tồn tại</h1>
        <p class="lead">Có thể đường dẫn đã thay đổi, bị xóa, hoặc cậu gõ thiếu ký tự. Thử quay lại trang chủ hoặc tìm nội dung khác nhé.</p>

        <form class="search" role="search" aria-label="Tìm kiếm trên trang" onsubmit="return handleSearch(event)">
          <input id="q" name="q" type="search" placeholder="Tìm nhanh nội dung…" aria-label="Ô tìm kiếm" />
          <button class="btn ghost" type="submit">Tìm</button>
        </form>

        <div class="actions">
          <a class="btn primary" href="/" aria-label="Về trang chủ">Về trang chủ</a>
          <button class="btn ghost" type="button" onclick="history.back()" aria-label="Quay lại trang trước">↩ Quay lại</button>
          <code class="code">Lỗi: 404_NOT_FOUND</code>
        </div>
        <p class="hint">Nếu cậu tin đây là lỗi, vui lòng <a href="#" style="color:inherit;text-underline-offset:3px">liên hệ hỗ trợ</a>.</p>
      </section>

      <aside class="art" aria-hidden="true">
        <!-- SVG giữ nguyên -->
      </aside>
    </div>

    <footer>
      <span>Không tìm thấy tài nguyên yêu cầu.</span>
      <span>⏱ <span id="ts" aria-live="polite"></span></span>
    </footer>
  </main>

  <script>
    // Hiển thị thời điểm hiện tại để tiện debug đường dẫn
    const tsEl = document.getElementById('ts');
    const fmt = new Intl.DateTimeFormat('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    function tick(){ tsEl.textContent = `Bây giờ: ${fmt.format(new Date())}` }
    tick(); setInterval(tick, 1000);

    // Lấy input từ pathname thay vì query
    const path = window.location.pathname.replace(/^\/+|\/+$/g, ''); 
    if(path){
      console.log("Đang ở trang:", path);
      // Cậu có thể thêm code ở đây để render nội dung theo path
    }

    // Xử lý ô tìm kiếm: điều hướng về /{input}
    function handleSearch(e){
      e.preventDefault();
      const q = (document.getElementById('q').value || '').trim();
      if(!q){
        // rung nhẹ input nếu rỗng
        const input = document.getElementById('q');
        input.animate([{transform:'translateX(0)'},{transform:'translateX(6px)'},{transform:'translateX(-6px)'},{transform:'translateX(0)'}], {duration:200, iterations:1});
        input.focus();
        return false;
      }
      // Điều hướng sang dạng /{input}
      window.location.href = '/' + encodeURIComponent(q);
      return false;
    }
  </script>
</body>
</html>
