 <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 – Không tìm thấy trang</title>
  <meta name="description" content="Trang 404 – Không tìm thấy nội dung bạn yêu cầu." />
  <style>
    /* Giữ nguyên toàn bộ CSS như cậu có ở trên */
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-labelledby="title">
    <div class="hero">
      <section>
        <div class="badge" aria-hidden="true">⚠️ 404 – Not Found</div>
        <h1 id="title">Ôi không… Trang cậu tìm không tồn tại</h1>
        <p class="lead">Có thể đường dẫn đã thay đổi, bị xóa, hoặc cậu gõ thiếu ký tự. Thử quay lại trang chủ hoặc tìm nội dung khác nhé.</p>

        <form class="search" role="search" aria-label="Tìm kiếm trên trang" onsubmit="return handleSearch(event)">
          <input id="q" name="q" type="search" placeholder="Tìm nhanh nội dung…" aria-label="Ô tìm kiếm" />
          <button class="btn ghost" type="submit">Tìm</button>
        </form>

        <div class="actions">
          <a class="btn primary" href="/" aria-label="Về trang chủ">Về trang chủ</a>
          <button class="btn ghost" type="button" onclick="history.back()" aria-label="Quay lại trang trước">↩ Quay lại</button>
          <code class="code">Lỗi: 404_NOT_FOUND</code>
        </div>
        <p class="hint">Nếu cậu tin đây là lỗi, vui lòng <a href="#" style="color:inherit;text-underline-offset:3px">liên hệ hỗ trợ</a>.</p>
      </section>

      <aside class="art" aria-hidden="true">
        <!-- SVG giữ nguyên -->
      </aside>
    </div>

    <footer>
      <span>Không tìm thấy tài nguyên yêu cầu.</span>
      <span>⏱ <span id="ts" aria-live="polite"></span></span>
    </footer>
  </main>

  <script>
    // Hiển thị thời điểm hiện tại để tiện debug đường dẫn
    const tsEl = document.getElementById('ts');
    const fmt = new Intl.DateTimeFormat('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    function tick(){ tsEl.textContent = `Bây giờ: ${fmt.format(new Date())}` }
    tick(); setInterval(tick, 1000);

    // Lấy input từ pathname thay vì query
    const path = window.location.pathname.replace(/^\/+|\/+$/g, ''); 
    if(path){
      console.log("Đang ở trang:", path);
      // Cậu có thể thêm code ở đây để render nội dung theo path
    }

    // Xử lý ô tìm kiếm: điều hướng về /{input}
    function handleSearch(e){
      e.preventDefault();
      const q = (document.getElementById('q').value || '').trim();
      if(!q){
        // rung nhẹ input nếu rỗng
        const input = document.getElementById('q');
        input.animate([{transform:'translateX(0)'},{transform:'translateX(6px)'},{transform:'translateX(-6px)'},{transform:'translateX(0)'}], {duration:200, iterations:1});
        input.focus();
        return false;
      }
      // Điều hướng sang dạng /{input}
      window.location.href = '/' + encodeURIComponent(q);
      return false;
    }
  </script>
</body>
</html>
