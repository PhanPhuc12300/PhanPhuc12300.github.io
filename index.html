 <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 – Không tìm thấy trang</title>
  <meta name="description" content="Trang 404 – Không tìm thấy nội dung bạn yêu cầu." />
  <style>
    :root {
      --bg: #0b0c10;
      --fg: #e6e6e6;
      --muted: #9aa0a6;
      --accent: #6ee7b7;
      --card: rgba(255, 255, 255, 0.04);
      --shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7fb;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #0ea5e9;
        --card: #ffffff;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 70% -10%, rgba(100, 116, 139, .15), transparent 60%),
                  radial-gradient(900px 600px at -10% 110%, rgba(14, 165, 233, .15), transparent 60%),
                  var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      line-height: 1.45;
    }

    .wrap {
      width: min(860px, 92vw);
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px clamp(20px, 4vw, 40px);
      position: relative;
      overflow: hidden;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .4rem .7rem;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-weight: 600;
      font-size: .85rem;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: clamp(16px, 3.5vw, 40px);
      align-items: center;
    }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; }
      .art { order: -1; }
    }

    h1 {
      margin: 12px 0 10px;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      letter-spacing: -0.02em;
    }

    p.lead {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: clamp(1rem, 2.3vw, 1.15rem);
    }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .85rem 1.1rem;
      border-radius: 14px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform .08s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
      text-decoration: none;
    }
    .btn:active { transform: translateY(1px); }

    .btn.primary {
      background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 92%, #fff 8%), var(--accent));
      color: #0b0c10;
      box-shadow: 0 8px 18px rgba(110, 231, 183, .25);
    }

    .btn.ghost {
      border-color: rgba(148,163,184,.35);
      color: var(--fg);
      background: transparent;
    }

    .hint { color: var(--muted); font-size: .95rem; margin-top: 10px; }

    .art {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      background: radial-gradient(200px 160px at 70% 25%, rgba(110,231,183,.35), transparent 60%),
                  radial-gradient(220px 180px at 30% 70%, rgba(14,165,233,.35), transparent 60%),
                  linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(148,163,184,.25);
    }

    .art svg { width: 72%; height: auto; opacity: .9; }

    .code {
      user-select: all;
      background: rgba(148,163,184,.12);
      padding: .3rem .55rem;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: .95rem;
      border: 1px dashed rgba(148,163,184,.35);
    }

    footer {
      margin-top: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: .9rem;
    }

    .search {
      display: flex; gap: 8px; margin: 14px 0 4px;
    }
    .search input {
      flex: 1; padding: .8rem .95rem; border-radius: 12px; border: 1px solid rgba(148,163,184,.35);
      background: transparent; color: var(--fg);
      outline: none;
    }
    .search input::placeholder { color: color-mix(in oklab, var(--muted) 85%, var(--fg) 15%); }
    .search button { white-space: nowrap; }

    /* Floating decorative dots */
    .dot { position: absolute; inset: auto; width: 8px; height: 8px; border-radius: 999px; opacity: .5; filter: blur(.2px); }
    .dot.a { background: #22d3ee; top: 10%; left: 8%; animation: float 10s ease-in-out infinite; }
    .dot.b { background: #34d399; bottom: 8%; right: 10%; animation: float 12s ease-in-out infinite reverse; }
    @keyframes float { 0%,100%{ transform: translateY(0)} 50%{ transform: translateY(-6px)} }
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-labelledby="title">
    <div class="hero">
      <section>
        <div class="badge" aria-hidden="true">⚠️ 404 – Not Found</div>
        <h1 id="title">Ôi không… Trang cậu tìm không tồn tại</h1>
        <p class="lead">Có thể đường dẫn đã thay đổi, bị xóa, hoặc cậu gõ thiếu ký tự. Thử quay lại trang chủ hoặc tìm nội dung khác nhé.</p>

        <form class="search" role="search" aria-label="Tìm kiếm trên trang" onsubmit="return handleSearch(event)">
          <input id="q" name="q" type="search" placeholder="Tìm nhanh nội dung…" aria-label="Ô tìm kiếm" />
          <button class="btn ghost" type="submit">Tìm</button>
        </form>

        <div class="actions">
          <a class="btn primary" href="/" aria-label="Về trang chủ">Về trang chủ</a>
          <button class="btn ghost" type="button" onclick="history.back()" aria-label="Quay lại trang trước">↩ Quay lại</button>
          <code class="code">Lỗi: 404_NOT_FOUND</code>
        </div>
        <p class="hint">Nếu cậu tin đây là lỗi, vui lòng <a href="thong-tin-ca-nhan" style="color:inherit;text-underline-offset:3px">liên hệ hỗ trợ</a>.</p>
      </section>

      <aside class="art" aria-hidden="true">
        <!-- SVG giữ nguyên -->
      </aside>
    </div>

    <footer>
      <span>Không tìm thấy tài nguyên yêu cầu.</span>
      <span>⏱ <span id="ts" aria-live="polite"></span></span>
    </footer>
  </main>

  <script>
    // Hiển thị thời điểm hiện tại để tiện debug đường dẫn
    const tsEl = document.getElementById('ts');
    const fmt = new Intl.DateTimeFormat('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    function tick(){ tsEl.textContent = `Bây giờ: ${fmt.format(new Date())}` }
    tick(); setInterval(tick, 1000);

    // Lấy input từ pathname thay vì query
    const path = window.location.pathname.replace(/^\/+|\/+$/g, ''); 
    if(path){
      console.log("Đang ở trang:", path);
      // Cậu có thể thêm code ở đây để render nội dung theo path
    }

    // Xử lý ô tìm kiếm: điều hướng về /{input}
    function handleSearch(e){
      e.preventDefault();
      const q = (document.getElementById('q').value || '').trim();
      if(!q){
        // rung nhẹ input nếu rỗng
        const input = document.getElementById('q');
        input.animate([{transform:'translateX(0)'},{transform:'translateX(6px)'},{transform:'translateX(-6px)'},{transform:'translateX(0)'}], {duration:200, iterations:1});
        input.focus();
        return false;
      }
      // Điều hướng sang dạng /{input}
      window.location.href = '/' + encodeURIComponent(q);
      return false;
    }
  </script>
</body>
</html>
