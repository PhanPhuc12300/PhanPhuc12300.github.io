<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bình luận</title>
  <style>
    body { font-family: sans-serif; background:#f6f6f6; padding:20px; }
    .comment-box { max-width:600px; margin:auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
    .comment-box input, .comment-box textarea { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:6px; }
    .comment-box button { padding:8px 16px; margin-top:8px; border:none; border-radius:6px; cursor:pointer; }
    #commentsList .comment { display:flex; gap:10px; margin:15px 0; padding-bottom:10px; border-bottom:1px solid #eee; }
    .avatar { width:40px; height:40px; display:flex; justify-content:center; align-items:center; border-radius:8px; font-weight:bold; color:#fff; }
    .meta .name { font-weight:600; }
    .meta .time { font-size:12px; color:#777; }
    .actions button { margin-left:5px; background:#eee; padding:4px 8px; border-radius:4px; }
  </style>
</head>
<body>
  <div class="comment-box">
    <h2>Bình luận</h2>
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="avatarPreview" class="avatar">T</div>
      <input id="nameInput" placeholder="Tên của bạn">
    </div>
    <textarea id="contentInput" rows="3" placeholder="Viết bình luận..."></textarea>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <small id="charCount">0</small>
      <div>
        <button id="clearBtn">Xóa</button>
        <button id="postBtn">Đăng</button>
      </div>
    </div>
    <div id="stats" style="margin-top:10px; font-size:14px; color:#444"></div>
    <div id="commentsList"></div>
  </div>

  <script>
    // Config
    const API_BASE = 'http://localhost:3000'; // đổi khi deploy

    const nameInput = document.getElementById('nameInput');
    const contentInput = document.getElementById('contentInput');
    const postBtn = document.getElementById('postBtn');
    const clearBtn = document.getElementById('clearBtn');
    const avatarPreview = document.getElementById('avatarPreview');
    const commentsList = document.getElementById('commentsList');
    const stats = document.getElementById('stats');
    const charCount = document.getElementById('charCount');

    function initials(name){ if(!name) return 'T'; const parts = name.trim().split(/\s+/); if(parts.length===1) return parts[0][0].toUpperCase(); return (parts[0][0]+parts[parts.length-1][0]).toUpperCase(); }
    function colorFromName(name){ let h=0; for(let i=0;i<name.length;i++) h=(h<<5)-h+name.charCodeAt(i); const hue = Math.abs(h)%360; return `linear-gradient(135deg, hsl(${hue} 60% 55%), hsl(${(hue+40)%360} 60% 45%))` }
    function escapeHTML(s){ return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'); }
    function timeAgo(iso){ const d=new Date(iso); const s=Math.floor((Date.now()-d)/1000); if(s<60) return s+'s'; if(s<3600) return Math.floor(s/60)+'m'; if(s<86400) return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d' }

    async function fetchComments(){
      try{
        const res = await fetch(API_BASE + '/comments');
        if(!res.ok) throw new Error('Fetch comments failed');
        const data = await res.json();
        render(data);
      }catch(err){
        console.error(err);
        commentsList.innerHTML = '<div style="color:#f88">Không tải được bình luận.</div>';
      }
    }

    function render(data){
      commentsList.innerHTML = '';
      data.forEach(c=>{
        const el = document.createElement('div'); el.className='comment'; el.dataset.id=c.id;
        el.innerHTML = `
          <div class="avatar" style="background:${colorFromName(c.name)}">${initials(c.name)}</div>
          <div class="meta">
            <div class="head" style="display:flex;align-items:center;gap:10px;">
              <div style="display:flex;flex-direction:column;">
                <div class="name">${escapeHTML(c.name||'Khách')}</div>
                <div class="time">${timeAgo(c.ts)} · ${new Date(c.ts).toLocaleString()}</div>
              </div>
              <div class="actions" style="margin-left:auto;">
                <button class="action-btn" data-action="like">👍 ${c.likes||0}</button>
                <button class="action-btn" data-action="edit">Sửa</button>
                <button class="action-btn" data-action="del">Xóa</button>
              </div>
            </div>
            <div class="text">${escapeHTML(c.content)}</div>
          </div>
        `;
        commentsList.appendChild(el);
      });
      stats.textContent = data.length + (data.length===1? ' bình luận' : ' bình luận');
    }

    postBtn.addEventListener('click', async ()=>{
      const name = nameInput.value.trim() || 'Khách';
      const content = contentInput.value.trim();
      if(!content){ alert('Viết gì đó đã!'); contentInput.focus(); return; }
      postBtn.disabled = true;
      try{
        const res = await fetch(API_BASE + '/comments', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ name, content })
        });
        if(!res.ok) throw await res.json();
        contentInput.value = ''; charCount.textContent = '0';
        await fetchComments();
      }catch(err){
        console.error(err);
        alert('Đăng bình luận thất bại.');
      } finally { postBtn.disabled = false; }
    });

    clearBtn.addEventListener('click', ()=>{ if(confirm('Xóa nội dung đang viết?')){ nameInput.value=''; contentInput.value=''; charCount.textContent='0'; updateAvatar(); } });

    commentsList.addEventListener('click', async (e)=>{
      const btn = e.target.closest('button');
      if(!btn) return;
      const action = btn.dataset.action;
      const itemEl = e.target.closest('.comment');
      if(!itemEl) return;
      const id = itemEl.dataset.id;
      try{
        if(action === 'del'){
          if(!confirm('Xác nhận xóa?')) return;
          const res = await fetch(API_BASE + '/comments/' + id, { method: 'DELETE' });
          if(!res.ok) throw await res.json();
          await fetchComments();
        } else if(action === 'edit'){
          const newText = prompt('Sửa bình luận:', itemEl.querySelector('.text').textContent);
          if(newText === null) return;
          const res = await fetch(API_BASE + '/comments/' + id, {
            method: 'PUT',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ content: newText })
          });
          if(!res.ok) throw await res.json();
          await fetchComments();
        } else if(action === 'like'){
          const res = await fetch(API_BASE + '/comments/' + id + '/like', { method: 'POST' });
          if(!res.ok) throw await res.json();
          await fetchComments();
        }
      } catch(err){
        console.error(err);
        alert('Hành động thất bại.');
      }
    });

    contentInput.addEventListener('input', ()=>{ charCount.textContent = contentInput.value.length });

    nameInput.addEventListener('input', updateAvatar);
    function updateAvatar(){ const name = nameInput.value.trim(); avatarPreview.textContent = initials(name); avatarPreview.style.background = name? colorFromName(name) : 'linear-gradient(90deg,#06b6d4,#7c3aed)'; }

    // init
    updateAvatar();
    fetchComments();
  </script>
</body>
</html>
