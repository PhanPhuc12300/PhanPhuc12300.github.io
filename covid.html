<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Báo cáo COVID-19</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #a1c4fd, #c2e9fb, #fbc2eb, #a6c1ee);
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      width: 250px;
      text-align: center;
    }
    .card h2 {
      margin-bottom: 10px;
    }
    .stat {
      margin: 10px 0;
      font-size: 18px;
    }
    .number {
      font-weight: bold;
      font-size: 20px;
    }
    .update {
      margin-top: 20px;
      font-size: 14px;
      color: #444;
    }
    canvas {
      margin-top: 40px;
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h1>Báo cáo COVID-19 (Toàn cầu & Việt Nam)</h1>
  <div class="container">
    <div class="card">
      <h2>🌍 Toàn cầu</h2>
      <div class="stat">Tổng ca <div class="number">704.753.890</div></div>
      <div class="stat">Ca mới <div class="number">+0</div></div>
      <div class="stat">Tử vong <div class="number">7.010.681</div></div>
      <div class="stat">Hồi phục <div class="number">675.619.811</div></div>
      <div class="stat">Đang nhiễm <div class="number">22.123.398</div></div>
    </div>
    <div class="card">
      <h2>🇻🇳 Việt Nam</h2>
      <div class="stat">Tổng ca <div class="number">11.625.195</div></div>
      <div class="stat">Ca mới <div class="number">+0</div></div>
      <div class="stat">Tử vong <div class="number">43.206</div></div>
      <div class="stat">Hồi phục <div class="number">10.640.971</div></div>
      <div class="stat">Đang nhiễm <div class="number">941.018</div></div>
    </div>
  </div>

  <canvas id="covidChart" width="600" height="300"></canvas>

  <div class="update">Cập nhật: 15:54:50, 13/9/2025</div>

  <script>
    const ctx = document.getElementById('covidChart').getContext('2d');
    const covidChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Tổng ca', 'Hồi phục', 'Tử vong', 'Đang nhiễm'],
        datasets: [
          {
            label: 'Toàn cầu',
            data: [704753890, 675619811, 7010681, 22123398],
            backgroundColor: 'rgba(54, 162, 235, 0.7)'
          },
          {
            label: 'Việt Nam',
            data: [11625195, 10640971, 43206, 941018],
            backgroundColor: 'rgba(255, 99, 132, 0.7)'
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top' },
          title: { display: true, text: 'So sánh tình hình COVID-19' }
        }
      }
    });
  </script>
</body>
</html>
