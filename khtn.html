<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bảng Tuần Hoàn 2D (Dark) — Đầy đủ 118 nguyên tố</title>
<style>
  :root{
    --bg:#071025;
    --card:#0f1724;
    --muted:rgba(255,255,255,0.72);
    --glass: rgba(255,255,255,0.03);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:Inter, "Segoe UI", Roboto, system-ui, Arial;
    background: radial-gradient(1200px 600px at 10% 10%, rgba(155,89,255,0.06), transparent 8%), 
                radial-gradient(800px 400px at 90% 90%, rgba(255,111,181,0.04), transparent 12%),
                var(--bg);
    color:var(--muted); -webkit-font-smoothing:antialiased;
    padding:20px;
    display:flex; flex-direction:column; align-items:center;
  }

  header{width:100%;max-width:1200px; display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  h1{color:#fff;margin:0;font-size:20px;letter-spacing:0.6px}
  .subtitle{font-size:13px;color:rgba(255,255,255,0.65)}

  .board-wrap{width:100%;max-width:1200px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:12px;padding:18px;border:1px solid rgba(255,255,255,0.04); box-shadow: 0 10px 40px rgba(2,6,23,0.6)}
  
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .legend .badge{padding:6px 10px;border-radius:8px;font-size:13px;background:var(--glass);border:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;gap:8px}
  .sw{width:18px;height:14px;border-radius:4px;box-shadow:0 6px 10px rgba(0,0,0,0.4) inset}

  /* grid layout - chuẩn 18 cột */
  .periodic {
    display:grid;
    grid-template-columns: repeat(18, 56px);
    grid-auto-rows: 60px;
    gap:8px;
    justify-content:center;
    padding:12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.03);
  }

  .element{
    width:56px;height:60px;border-radius:8px;padding:6px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12));
    color:#0b0f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-weight:700;
    transition: transform .15s ease, box-shadow .15s ease;
    cursor:pointer;border:1px solid rgba(255,255,255,0.03);
  }
  .element.hovered, .element:hover{
    transform: translateY(-6px) scale(1.08);
    box-shadow: 0 14px 40px rgba(0,0,0,0.6), 0 0 18px rgba(255,255,255,0.03) inset;
    z-index:50;
  }
  .atomic-number{position:absolute;top:6px;left:6px;font-size:11px;color:rgba(0,0,0,0.6);font-weight:800}
  .symbol{font-size:18px;color:#071025;margin-top:4px}
  .mass{font-size:10px;color:rgba(0,0,0,0.55);margin-top:4px;font-weight:600}

  /* tooltip */
  .tooltip {
    position:fixed;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(10,12,20,0.96), rgba(25,25,38,0.98));
    color:#fff;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);font-size:13px;min-width:200px;
    box-shadow: 0 12px 40px rgba(2,6,23,0.6);
    display:none; z-index:9999;
  }
  .tooltip h3{margin:0 0 6px 0;font-size:15px}
  .tooltip p{margin:2px 0;color:rgba(255,255,255,0.85);font-size:13px}

  /* Colors per type (dark-friendly: text dark on light card) */
  .type-alkali { background: linear-gradient(180deg,#FFE29F,#FFD27A); }       /* kim loại kiềm */
  .type-alkaline { background: linear-gradient(180deg,#FFF1B8,#FFE0A8); }     /* kiềm thổ */
  .type-transition { background: linear-gradient(180deg,#FFCF9A,#FFB78E); }   /* chuyển tiếp */
  .type-post { background: linear-gradient(180deg,#F6C6FF,#E7B7FF); }         /* kim loại hậu */
  .type-metalloid { background: linear-gradient(180deg,#C9E4FF,#A8D6FF); }     /* á kim */
  .type-nonmetal { background: linear-gradient(180deg,#B8FFC7,#7EE4A8); }      /* phi kim */
  .type-halogen { background: linear-gradient(180deg,#FFB6D6,#FFA1C4); }       /* halogen */
  .type-noble { background: linear-gradient(180deg,#CDB8FF,#B79CFF); }         /* khí hiếm */
  .type-lanth { background: linear-gradient(180deg,#FFD6A5,#FFC29B); }        /* lantanoid */
  .type-actin { background: linear-gradient(180deg,#FFCBCB,#FFB3B3); }        /* actinide */
  .type-unknown { background: linear-gradient(180deg,#E0E0E0,#CFCFCF); }      /* unknown / placeholder */

  /* legend colors small adjustment to match */
  .legend .sw.alkali{background:linear-gradient(180deg,#FFE29F,#FFD27A)}
  .legend .sw.transition{background:linear-gradient(180deg,#FFCF9A,#FFB78E)}
  .legend .sw.nonmetal{background:linear-gradient(180deg,#B8FFC7,#7EE4A8)}
  .legend .sw.noble{background:linear-gradient(180deg,#CDB8FF,#B79CFF)}
  .legend .sw.metalloid{background:linear-gradient(180deg,#C9E4FF,#A8D6FF)}
  .legend .sw.halogen{background:linear-gradient(180deg,#FFB6D6,#FFA1C4)}
  .legend .sw.lanth{background:linear-gradient(180deg,#FFD6A5,#FFC29B)}
  .legend .sw.actin{background:linear-gradient(180deg,#FFCBCB,#FFB3B3)}

  /* responsive */
  @media (max-width:980px){
    .periodic{grid-template-columns: repeat(18, 44px); grid-auto-rows:48px; gap:6px}
    .element{width:44px;height:48px;border-radius:8px;padding:4px}
    .symbol{font-size:14px}
    .atomic-number{top:4px;left:4px;font-size:10px}
    .mass{font-size:9px}
  }
  @media (max-width:560px){
    body{padding:10px}
    .periodic{grid-template-columns: repeat(18, 36px); grid-auto-rows:40px; gap:5px}
    .element{width:36px;height:40px;padding:3px}
    .symbol{font-size:12px}
    .atomic-number{font-size:9px}
    .mass{display:none}
  }
</style>
</head>

  div.style.gridRow = el.row;
  div.style.gridColumn = el.col;
  div.setAttribute('data-z', el.z);
  div.setAttribute('data-name', el.name);
  div.setAttribute('data-sym', el.sym);
  div.setAttribute('data-mass', el.mass);
  div.setAttribute('data-val', el.val);
  div.setAttribute('data-type', el.type);

  div.innerHTML = `<div class="atomic-number">${el.z}</div>
                   <div class="symbol">${el.sym}</div>
                   <div class="mass">${el.mass}</div>`;

  // hover / focus tooltip (mouse)
  div.addEventListener('mousemove', (ev)=>{
    const html = `<h3>${el.sym} — ${el.name}</h3>
                  <p>Số nguyên tử: <b>${el.z}</b></p>
                  <p>Khối lượng: <b>${el.mass}</b></p>
                  <p>Hóa trị: <b>${el.val}</b></p>
                  <p>Loại: <b>${prettyType(el.type)}</b></p>`;
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    positionTooltip(ev.clientX, ev.clientY);
  });
  div.addEventListener('mouseleave', ()=>{
    tooltip.style.display = 'none';
  });

  // mobile: tap shows tooltip (toggle)
  let tapped = false;
  div.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    tapped = !tapped;
    if(tapped){
      const rect = ev.currentTarget.getBoundingClientRect();
      const centerX = rect.left + rect.width/2;
      const centerY = rect.top - 8;
      const html = `<h3>${el.sym} — ${el.name}</h3>
                    <p>Số nguyên tử: <b>${el.z}</b></p>
                    <p>Khối lượng: <b>${el.mass}</b></p>
                    <p>Hóa trị: <b>${el.val}</b></p>
                    <p>Loại: <b>${prettyType(el.type)}</b></p>`;
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
      positionTooltip(centerX, centerY);
    } else {
      tooltip.style.display = 'none';
    }
  });

  container.appendChild(div);
});

// hide tooltip on body click (mobile)
document.body.addEventListener('click', ()=> tooltip.style.display='none');

function positionTooltip(x,y){
  const tRect = tooltip.getBoundingClientRect();
  const pad = 12;
  let left = x + 14;
  let top = y + 14;
  // if overflow right
  if(left + tRect.width + pad > window.innerWidth) left = x - tRect.width - 18;
  if(top + tRect.height + pad > window.innerHeight) top = y - tRect.height - 18;
  if(left < 8) left = 8;
  if(top < 8) top = 8;
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function prettyType(t){
  switch(t){
    case 'type-alkali': return 'Kim loại kiềm';
    case 'type-alkaline': return 'Kim loại kiềm thổ';
    case 'type-transition': return 'Kim loại chuyển tiếp';
    case 'type-post': return 'Kim loại (hậu nhóm)';
    case 'type-metalloid': return 'Á kim';
    case 'type-nonmetal': return 'Phi kim';
    case 'type-halogen': return 'Halogen';
    case 'type-noble': return 'Khí hiếm';
    case 'type-lanth': return 'Lanthanoid';
    case 'type-actin': return 'Actinide';
    default: return 'Không xác định';
  }
}
</script>
