<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng tuần hoàn 3D - Three.js</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #020024, #090979, #00d4ff);
    font-family: 'Poppins', sans-serif;
  }
  .button {
    position: absolute;
    left: 10px;
    padding: 10px 16px;
    background: linear-gradient(145deg, #ffb6ff, #b344ff);
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }
  .button:hover {
    transform: scale(1.05);
    background: linear-gradient(145deg, #b344ff, #ffb6ff);
  }
  #reset { top: 20px; }
  #grid { top: 70px; }
  #table { top: 120px; }
  .credit {
    position: absolute;
    bottom: 10px;
    left: 10px;
    color: rgba(255,255,255,0.8);
    font-size: 13px;
  }
</style>
</head>
<body>
  <button id="reset" class="button">Reset View</button>
  <button id="grid" class="button">Xếp Grid</button>
  <button id="table" class="button">Xếp Bảng</button>
  <div class="credit">Miền và code được làm bởi <b>PhanPhuc12300</b></div>

  <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.155.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.155.0/examples/js/renderers/CSS3DRenderer.js"></script>

  <script>
    const table = [
      "H", "He", "Li", "Be", "B", "C", "N", "O", "F", "Ne",
      "Na", "Mg", "Al", "Si", "P", "S", "Cl", "Ar",
      "K", "Ca", "Sc", "Ti", "V", "Cr", "Mn", "Fe", "Co", "Ni", "Cu", "Zn"
    ];

    let camera, scene, renderer, controls;
    const objects = [];
    const targets = { table: [], grid: [] };

    init();
    animate();

    function init() {
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
      camera.position.z = 3000;

      scene = new THREE.Scene();

      // Tạo các ô nguyên tố
      for (let i = 0; i < table.length; i++) {
        const element = document.createElement('div');
        element.className = 'element';
        element.style.width = '120px';
        element.style.height = '160px';
        element.style.background = 'rgba(255,255,255,0.15)';
        element.style.border = '1px solid rgba(255,255,255,0.25)';
        element.style.borderRadius = '15px';
        element.style.color = '#fff';
        element.style.fontSize = '32px';
        element.style.display = 'flex';
        element.style.alignItems = 'center';
        element.style.justifyContent = 'center';
        element.style.backdropFilter = 'blur(5px)';
        element.textContent = table[i];

        const objectCSS = new THREE.CSS3DObject(element);
        objectCSS.position.x = Math.random() * 4000 - 2000;
        objectCSS.position.y = Math.random() * 4000 - 2000;
        objectCSS.position.z = Math.random() * 4000 - 2000;
        scene.add(objectCSS);

        objects.push(objectCSS);

        const object = new THREE.Object3D();
        object.position.x = (i % 10) * 250 - 1000;
        object.position.y = - (Math.floor(i / 10)) * 250 + 500;
        targets.table.push(object);

        const gridObj = new THREE.Object3D();
        gridObj.position.x = (i % 5) * 300 - 600;
        gridObj.position.y = - (Math.floor(i / 5)) * 300 + 300;
        gridObj.position.z = (i % 3) * 300 - 300;
        targets.grid.push(gridObj);
      }

      renderer = new THREE.CSS3DRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      transform(targets.table, 2000);

      document.getElementById('grid').addEventListener('click', function() {
        transform(targets.grid, 2000);
      });

      document.getElementById('table').addEventListener('click', function() {
        transform(targets.table, 2000);
      });

      document.getElementById('reset').addEventListener('click', function() {
        camera.position.set(0, 0, 3000);
      });

      window.addEventListener('resize', onWindowResize);
    }

    function transform(targets, duration) {
      TWEEN.removeAll();

      for (let i = 0; i < objects.length; i++) {
        const object = objects[i];
        const target = targets[i];

        new TWEEN.Tween(object.position)
          .to({ x: target.position.x, y: target.position.y, z: target.position.z }, duration)
          .easing(TWEEN.Easing.Exponential.InOut)
          .start();

        new TWEEN.Tween(object.rotation)
          .to({ x: 0, y: 0, z: 0 }, duration)
          .easing(TWEEN.Easing.Exponential.InOut)
          .start();
      }

      new TWEEN.Tween(this)
        .to({}, duration * 2)
        .onUpdate(render)
        .start();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      render();
    }

    function animate() {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();
      render();
    }

    function render() {
      renderer.render(scene, camera);
    }
  </script>

  <!-- TWEEN cho animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</body>
</html>
