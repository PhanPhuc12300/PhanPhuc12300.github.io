<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng tuần hoàn 2D - Phiên bản màu mè</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top left, #ff7eb3, #8e44ad, #2c3e50);
    font-family: "Poppins", sans-serif;
    color: #fff;
    overflow-x: hidden;
    text-align: center;
  }

  h1 {
    margin-top: 30px;
    font-size: 40px;
    text-shadow: 2px 2px 10px rgba(255,255,255,0.3);
    letter-spacing: 2px;
  }

  .table {
    display: grid;
    grid-template-columns: repeat(18, 70px);
    grid-gap: 6px;
    justify-content: center;
    margin: 50px auto;
  }

  .element {
    width: 70px;
    height: 70px;
    background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(0,0,0,0.2));
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: 0.3s ease;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 8px rgba(255,255,255,0.2);
  }

  .element:hover {
    transform: scale(1.2) rotate(5deg);
    background: linear-gradient(145deg, #ff9a9e, #fad0c4);
    box-shadow: 0 0 25px #fff;
  }

  .symbol {
    font-size: 22px;
  }
  .number {
    font-size: 12px;
    opacity: 0.8;
  }

  footer {
    margin: 20px;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>
  <h1>🌈 BẢNG TUẦN HOÀN NGUYÊN TỐ 2D 🌈</h1>

  <div class="table" id="table"></div>

  <footer>Code by <b>PhanPhuc12300</b> 🧪</footer>

  <script>
    // Dữ liệu cơ bản (chỉ 30 nguyên tố đầu cho nhẹ)
    const elements = [
      {num:1, sym:"H"},{num:2,sym:"He"},
      {num:3,sym:"Li"},{num:4,sym:"Be"},{num:5,sym:"B"},{num:6,sym:"C"},{num:7,sym:"N"},{num:8,sym:"O"},{num:9,sym:"F"},{num:10,sym:"Ne"},
      {num:11,sym:"Na"},{num:12,sym:"Mg"},
      {num:13,sym:"Al"},{num:14,sym:"Si"},{num:15,sym:"P"},{num:16,sym:"S"},{num:17,sym:"Cl"},{num:18,sym:"Ar"},
      {num:19,sym:"K"},{num:20,sym:"Ca"},{num:21,sym:"Sc"},{num:22,sym:"Ti"},{num:23,sym:"V"},{num:24,sym:"Cr"},{num:25,sym:"Mn"},{num:26,sym:"Fe"},{num:27,sym:"Co"},{num:28,sym:"Ni"},{num:29,sym:"Cu"},{num:30,sym:"Zn"}
    ];

    const colors = [
      "#ff9a9e","#fbc2eb","#a1c4fd","#f6d365","#84fab0","#fccb90","#a18cd1","#cfd9df","#fda085","#ffecd2"
    ];

    const table = document.getElementById("table");

    elements.forEach((e,i)=>{
      const div = document.createElement("div");
      div.className = "element";
      div.style.background = `linear-gradient(145deg, ${colors[i%colors.length]}, ${colors[(i+3)%colors.length]})`;

      div.innerHTML = `
        <div class="number">${e.num}</div>
        <div class="symbol">${e.sym}</div>
      `;

      div.addEventListener("click", ()=>{
        alert(`Nguyên tố ${e.sym} - Số hiệu nguyên tử: ${e.num}`);
      });

      table.appendChild(div);
    });
  </script>
</body>
</html>
