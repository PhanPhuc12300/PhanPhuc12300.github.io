<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng tuần hoàn nguyên tố 2D 🌈</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top left, #ff7eb3, #8e44ad, #2c3e50);
    font-family: "Poppins", sans-serif;
    color: #fff;
    overflow-x: hidden;
    text-align: center;
  }

  h1 {
    margin-top: 30px;
    font-size: 40px;
    text-shadow: 2px 2px 10px rgba(255,255,255,0.3);
    letter-spacing: 2px;
  }

  .table {
    display: grid;
    grid-template-columns: repeat(18, 70px);
    grid-gap: 6px;
    justify-content: center;
    margin: 50px auto;
    width: fit-content;
  }

  .element {
    width: 70px;
    height: 70px;
    background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(0,0,0,0.2));
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: 0.3s ease;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 8px rgba(255,255,255,0.2);
  }

  .element:hover {
    transform: scale(1.2) rotate(5deg);
    box-shadow: 0 0 25px #fff;
    z-index: 2;
  }

  .symbol {
    font-size: 22px;
  }
  .number {
    font-size: 12px;
    opacity: 0.8;
  }

  footer {
    margin: 20px;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
  }

  /* nhóm màu */
  .kimloai-kiem { background: linear-gradient(145deg,#ff9a9e,#fad0c4); }
  .kimloai-kiemtho { background: linear-gradient(145deg,#fbc2eb,#a6c1ee); }
  .transition { background: linear-gradient(145deg,#a1c4fd,#c2e9fb); }
  .postmetal { background: linear-gradient(145deg,#f6d365,#fda085); }
  .metalloid { background: linear-gradient(145deg,#84fab0,#8fd3f4); }
  .nonmetal { background: linear-gradient(145deg,#fccb90,#d57eeb); }
  .halogen { background: linear-gradient(145deg,#fda085,#f6d365); }
  .noble { background: linear-gradient(145deg,#a18cd1,#fbc2eb); }
  .lanthanide { background: linear-gradient(145deg,#fcb69f,#ffecd2); }
  .actinide { background: linear-gradient(145deg,#cfd9df,#e2ebf0); }

</style>
</head>

  <div class="table" id="table"></div>
  <footer>Code by <b>PhanPhuc12300</b> 🧪</footer>
