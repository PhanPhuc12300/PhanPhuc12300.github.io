<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Comment Widget — Chill & Đẹp</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa4b2;
      --accent:#6ee7b7;
      --glass: rgba(255,255,255,0.03);
      --radius:14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; background:linear-gradient(180deg,#071023 0%, #051426 60%); color:#e6eef6; display:flex; align-items:center; justify-content:center; padding:40px;
    }

    .wrap{width:100%; max-width:900px}

    header{display:flex; align-items:center; gap:16px; margin-bottom:18px}
    header h1{margin:0; font-size:20px}
    header p{margin:0; color:var(--muted); font-size:13px}

    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:var(--radius); padding:18px; box-shadow:0 6px 30px rgba(2,6,23,0.6);}

    form.comment-form{display:grid; gap:10px; grid-template-columns: 110px 1fr; align-items:start}
    .avatar-input{width:96px; height:96px; border-radius:12px; background:var(--glass); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--accent); font-size:22px}
    .fields{display:flex; flex-direction:column; gap:8px}

    input[type=text], textarea{background:transparent; border:1px solid rgba(255,255,255,0.06); padding:10px 12px; color:inherit; border-radius:10px; outline:none; min-width:0}
    textarea{min-height:90px; resize:vertical}
    .controls{display:flex; gap:8px; align-items:center}
    button.primary{background:linear-gradient(90deg, #10b981, #34d399); border:none; color:#04231a; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600}
    button.ghost{background:transparent; border:1px solid rgba(255,255,255,0.04); padding:8px 12px; border-radius:10px; color:var(--muted); cursor:pointer}

    .list{margin-top:18px; display:flex; flex-direction:column; gap:12px}
    .comment{display:flex; gap:12px; padding:12px; border-radius:12px; background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent); border:1px solid rgba(255,255,255,0.02)}
    .comment .avatar{width:56px; height:56px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700}
    .meta{flex:1}
    .meta .head{display:flex; gap:10px; align-items:center}
    .meta .name{font-weight:700}
    .meta .time{color:var(--muted); font-size:13px}
    .text{margin-top:8px; white-space:pre-wrap}

    .actions{display:flex; gap:8px; align-items:center; margin-left:auto}
    .action-btn{background:transparent; border:none; color:var(--muted); cursor:pointer; font-weight:600}

    .footer{margin-top:14px; display:flex; justify-content:space-between; color:var(--muted); font-size:13px}

    @media (max-width:640px){
      form.comment-form{grid-template-columns: 72px 1fr}
      .avatar-input{width:72px;height:72px;font-size:18px}
      .comment .avatar{width:48px;height:48px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(90deg,#06b6d4,#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:700">CG</div>
      <div>
        <h1>Hộp bình luận</h1>
        <p>Ghi và hiển thị comment — lưu tạm bằng localStorage. Muốn sync server tớ thêm API luôn.</p>
      </div>
    </header>

    <div class="card">
      <form id="commentForm" class="comment-form" onsubmit="return false">
        <div class="avatar-input" id="avatarPreview">T</div>

        <div class="fields">
          <input type="text" id="nameInput" placeholder="Tên (ví dụ: Tuấn, Mai...)" maxlength="40" />
          <textarea id="contentInput" placeholder="Viết bình luận..." maxlength="1000"></textarea>

          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <div class="controls">
              <button id="postBtn" class="primary">Đăng</button>
              <button id="clearBtn" class="ghost" type="button">Xóa</button>
            </div>
            <div style="color:var(--muted);font-size:13px">Số ký tự: <span id="charCount">0</span>/1000</div>
          </div>
        </div>
      </form>

      <div class="list" id="commentsList" aria-live="polite"></div>

      <div class="footer"><div id="stats">0 bình luận</div><div style="opacity:0.8">Đã lưu cục bộ trong trình duyệt</div></div>
    </div>
  </div>

  <script>
    // Simple comment system using localStorage. ID, name, content, ts, likes
    const LS_KEY = 'chill_comments_v1'
    const nameInput = document.getElementById('nameInput')
    const contentInput = document.getElementById('contentInput')
    const postBtn = document.getElementById('postBtn')
    const clearBtn = document.getElementById('clearBtn')
    const avatarPreview = document.getElementById('avatarPreview')
    const commentsList = document.getElementById('commentsList')
    const stats = document.getElementById('stats')
    const charCount = document.getElementById('charCount')

    function uid(){ return Math.random().toString(36).slice(2,9) }
    function nowISO(){ return new Date().toISOString() }
    function timeAgo(iso){ const d=new Date(iso); const s=Math.floor((Date.now()-d)/1000); if(s<60) return s+'s'; if(s<3600) return Math.floor(s/60)+'m'; if(s<86400) return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d' }

    function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||[] }catch(e){return[]} }
    function save(data){ localStorage.setItem(LS_KEY, JSON.stringify(data)) }

    function initials(name){ if(!name) return 'T'; const parts = name.trim().split(/\s+/); if(parts.length===1) return parts[0][0].toUpperCase(); return (parts[0][0]+parts[parts.length-1][0]).toUpperCase(); }
    function colorFromName(name){ // deterministic color
      let h=0; for(let i=0;i<name.length;i++) h=(h<<5)-h+name.charCodeAt(i); const hue = Math.abs(h)%360; return `linear-gradient(135deg, hsl(${hue} 60% 55%), hsl(${(hue+40)%360} 60% 45%))` }

    function render(){ const data = load(); commentsList.innerHTML=''; data.sort((a,b)=> new Date(b.ts)-new Date(a.ts)); data.forEach(c=>{
      const el = document.createElement('div'); el.className='comment'; el.dataset.id=c.id
      el.innerHTML = `
        <div class="avatar" style="background:${c.avatarBg};color:#fff;border-radius:8px">${c.initials}</div>
        <div class="meta">
          <div class="head">
            <div style="display:flex;flex-direction:column;">
              <div class="name">${escapeHTML(c.name||'Khách')}</div>
              <div class="time">${timeAgo(c.ts)} · ${new Date(c.ts).toLocaleString()}</div>
            </div>
            <div class="actions">
              <button class="action-btn" data-action="like">👍 ${c.likes||0}</button>
              <button class="action-btn" data-action="edit">Sửa</button>
              <button class="action-btn" data-action="del">Xóa</button>
            </div>
          </div>
          <div class="text">${escapeHTML(c.content)}</div>
        </div>
      `
      commentsList.appendChild(el)
    })
    stats.textContent = data.length + (data.length===1? ' bình luận' : ' bình luận') }

    function escapeHTML(s){ return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;') }

    postBtn.addEventListener('click', ()=>{
      const name = nameInput.value.trim() || 'Khách'
      const content = contentInput.value.trim()
      if(!content){ alert('Viết gì đó đã!'); contentInput.focus(); return }
      const data = load()
      const item = { id: uid(), name, content, ts: nowISO(), likes:0, initials:initials(name), avatarBg: colorFromName(name) }
      data.push(item); save(data); contentInput.value=''; charCount.textContent='0'; render()
    })

    clearBtn.addEventListener('click', ()=>{ if(confirm('Xóa nội dung đang viết?')){ nameInput.value=''; contentInput.value=''; charCount.textContent='0'; updateAvatar() } })

    commentsList.addEventListener('click', (e)=>{
      const btn = e.target.closest('button')
      if(!btn) return; const action = btn.dataset.action; const itemEl = e.target.closest('.comment'); if(!itemEl) return; const id = itemEl.dataset.id
      let data = load(); const idx = data.findIndex(x=>x.id===id); if(idx===-1) return
      if(action==='del'){
        if(confirm('Xác nhận xóa bình luận?')){ data.splice(idx,1); save(data); render() }
      }else if(action==='edit'){
        const it = data[idx]; const newText = prompt('Sửa bình luận:', it.content); if(newText!==null){ it.content = newText; it.ts = nowISO(); save(data); render() }
      }else if(action==='like'){
        data[idx].likes = (data[idx].likes||0)+1; save(data); render()
      }
    })

    contentInput.addEventListener('input', ()=>{ charCount.textContent = contentInput.value.length })
    nameInput.addEventListener('input', updateAvatar)

    function updateAvatar(){ const name = nameInput.value.trim(); avatarPreview.textContent = initials(name); avatarPreview.style.background = name? colorFromName(name) : 'linear-gradient(90deg,#06b6d4,#7c3aed)'; }

    // init
    render(); updateAvatar();

    // For demo: seed if empty
    if(load().length===0){ const demo=[
      {id:uid(), name:'Linh', content:'Giao diện quá đẹp!', ts: new Date(Date.now()-1000*60*60).toISOString(), likes:3, initials:'L', avatarBg: colorFromName('Linh')},
      {id:uid(), name:'Nam', content:'Tớ muốn tính năng reply, cậu thêm nhé?', ts: new Date(Date.now()-1000*60*120).toISOString(), likes:1, initials:'N', avatarBg: colorFromName('Nam')}
    ]; save(demo); render()
    }

  </script>
</body>
</html>
