<script>
// ==============================
// YouTube Loop Player – by Thỏ Ngọc 💫
// ==============================

let player = null;
let playerReady = false;
let ytApiLoaded = false;
let currentVideoId = null;

// Kiểm tra API có load chưa, nếu chưa thì load lại
const ensureYouTubeAPI = () => {
  if (!ytApiLoaded && typeof YT === "undefined") {
    console.warn("⚠️ YouTube API chưa sẵn sàng, đang nạp lại...");
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);
  }
};

// Gọi khi API sẵn sàng
function onYouTubeIframeAPIReady() {
  ytApiLoaded = true;
  console.log("🎬 YouTube API đã sẵn sàng");

  player = new YT.Player('yt-player', {
    height: '0',
    width: '0',
    videoId: '',
    playerVars: {
      autoplay: 0,
      controls: 0,
      rel: 0,
      modestbranding: 1,
      loop: 1,
      playlist: ''
    },
    events: {
      onReady: (e) => {
        playerReady = true;
        console.log("✅ Player đã sẵn sàng");
        updateStatus('Player đã sẵn sàng 🎧');
        bindPlaylistButtons(); // Gắn sự kiện Play sau khi player sẵn sàng
      },
      onStateChange: onPlayerStateChange
    }
  });
}

// Khi trạng thái player thay đổi
function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.ENDED) {
    player.playVideo(); // tự loop lại
  }
}

// Cập nhật trạng thái hiển thị
function updateStatus(text) {
  const el = document.querySelector('.status');
  if (el) el.textContent = text;
}

// Tách videoId từ link
function extractVideoId(url) {
  const match = url.match(/(?:v=|\.be\/)([a-zA-Z0-9_-]{11})/);
  return match ? match[1] : url;
}

// Gọi khi click "Play" một bài
async function playVideo(videoId) {
  if (!playerReady) {
    updateStatus('⏳ Đang khởi tạo player...');
    console.warn("Player chưa sẵn sàng, thử lại sau...");
    return;
  }

  if (videoId === currentVideoId) {
    player.playVideo();
    updateStatus('▶️ Đang phát lại');
    return;
  }

  currentVideoId = videoId;
  player.loadVideoById(videoId);
  updateStatus('🎶 Đang phát nhạc...');
}

// Tạm dừng
function pauseVideo() {
  if (playerReady) {
    player.pauseVideo();
    updateStatus('⏸️ Đã tạm dừng');
  }
}

// Dừng hẳn
function stopVideo() {
  if (playerReady) {
    player.stopVideo();
    updateStatus('⏹️ Đã dừng phát');
  }
}

// Gắn sự kiện cho các nút Play trong danh sách
function bindPlaylistButtons() {
  const tracks = document.querySelectorAll('.track');
  tracks.forEach(track => {
    const btn = track.querySelector('.playBtn');
    btn.addEventListener('click', () => {
      const src = track.getAttribute('data-src');
      const id = extractVideoId(src);
      playVideo(id);

      // Đổi trạng thái hiển thị
      document.querySelectorAll('.track').forEach(t => t.classList.remove('playing'));
      track.classList.add('playing');
    });
  });

  // Gắn sự kiện cho Pause/Stop
  document.getElementById('pauseAll').addEventListener('click', pauseVideo);
  document.getElementById('stopAll').addEventListener('click', stopVideo);
}

// Khi trang vừa load
window.addEventListener('load', () => {
  // Nạp API YouTube
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  // Kiểm tra lại sau 3s nếu chưa sẵn sàng
  setTimeout(ensureYouTubeAPI, 3000);

  updateStatus('⏳ Đang khởi tạo player...');
});
</script>
