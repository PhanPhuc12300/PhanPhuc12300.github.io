<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Player — YouTube</title>
  <style>
    body {
      background: #0e0b20;
      color: white;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px;
    }
    .container {
      background: #1b1438;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255,255,255,0.05);
      width: 80%;
      max-width: 900px;
    }
    h1 {
      font-size: 26px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 span {
      background: #f48fff;
      color: #fff;
      font-weight: bold;
      border-radius: 10px;
      padding: 5px 10px;
    }
    .list {
      margin-top: 20px;
      background: #140f2d;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0e0b20;
      padding: 12px 16px;
      border-radius: 10px;
      transition: 0.2s;
    }
    .item:hover { background: #241c4a; }
    .item button {
      background: #f48fff;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .item button.playing {
      background: #9d59ff;
      color: white;
    }
    .status-box {
      margin-top: 20px;
      background: #140f2d;
      border-radius: 14px;
      padding: 20px;
    }
    .status {
      font-size: 16px;
      color: #d1b3ff;
      margin-bottom: 10px;
    }
    #yt-player { display: none; }
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .controls button {
      background: #9d59ff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span>YT</span> Loop Player — YouTube</h1>
    <p>Paste link YouTube (hoặc video ID). Chọn 1 bài để play.</p>

    <div class="list" id="playlist">
      <div class="item">
        <div>0 — Anh Vui x Địa Ngục Trần Gian - Phạm Kỳ x DJ Trang Moon</div>
        <button onclick="playSong(this, 'HYyRZCzrb2M')">Play</button>
      </div>
      <div class="item">
        <div>1 — Phép Màu (Đàn Cá Gỗ OST)</div>
        <button onclick="playSong(this, '02WRgZVxu4E')">Play</button>
      </div>
      <div class="item">
        <div>2 — Night Dancer - Imase</div>
        <button onclick="playSong(this, 'hRFUZBXOWZI')">Play</button>
      </div>
      <div class="item">
        <div>3 — TheFatRat - Unity</div>
        <button onclick="playSong(this, 'n8X9_MgEdCg')">Play</button>
      </div>
      <div class="item">
        <div>4 — Muộn Rồi Mà Sao Còn - Sơn Tùng MTP</div>
        <button onclick="playSong(this, 'ssNhxGxSOiY')">Play</button>
      </div>
    </div>

    <div class="status-box">
      <div class="status">🎧 Đang khởi tạo player...</div>
      <div class="controls">
        <button onclick="pauseVideo()">Pause</button>
        <button onclick="stopVideo()">Stop</button>
      </div>
    </div>

    <div id="yt-player"></div>
  </div>

  <!-- YouTube API -->
  <script>
    // ==== Biến toàn cục ====
    let player = null;
    let playerReady = false;
    let currentVideoId = null;
    let ytApiLoaded = false;

    // ==== Tự load API ====
    function loadYouTubeAPI() {
      if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);
        console.log("📡 Đang tải YouTube IFrame API...");
      }
    }

    // ==== Khi API sẵn sàng ====
    function onYouTubeIframeAPIReady() {
      ytApiLoaded = true;
      console.log("✅ API YouTube đã sẵn sàng, khởi tạo player...");

      player = new YT.Player('yt-player', {
        height: '0',
        width: '0',
        videoId: '',
        playerVars: {
          autoplay: 0,
          controls: 0,
          rel: 0,
          modestbranding: 1,
          loop: 1,
          playlist: ''
        },
        events: {
          onReady: (e) => {
            playerReady = true;
            console.log("🎵 Player đã sẵn sàng!");
            document.querySelector('.status').textContent = "✅ Player đã sẵn sàng!";
          },
          onStateChange: onPlayerStateChange
        }
      });
    }

    // ==== Khi player thay đổi trạng thái ====
    function onPlayerStateChange(event) {
      switch (event.data) {
        case YT.PlayerState.PLAYING:
          console.log("▶️ Đang phát:", currentVideoId);
          break;
        case YT.PlayerState.PAUSED:
          console.log("⏸️ Tạm dừng");
          break;
        case YT.PlayerState.ENDED:
          console.log("🔁 Lặp lại bài:", currentVideoId);
          player.playVideo();
          break;
      }
    }

    // ==== Phát bài ====
    function playVideo(videoId) {
      const status = document.querySelector('.status');
      if (!playerReady) {
        console.warn("⚠️ Player chưa sẵn sàng!");
        status.textContent = "Đang khởi tạo player...";
        return;
      }
      if (videoId !== currentVideoId) {
        currentVideoId = videoId;
        player.loadVideoById(videoId);
      } else {
        player.playVideo();
      }
      status.textContent = "🎶 Đang phát bài...";
    }

    // ==== Hàm cho nút Play từng bài ====
    function playSong(btn, id) {
      document.querySelectorAll(".item button").forEach(b => b.classList.remove("playing"));
      btn.classList.add("playing");
      playVideo(id);
    }

    // ==== Pause và Stop ====
    function pauseVideo() {
      if (player && playerReady) player.pauseVideo();
    }
    function stopVideo() {
      if (player && playerReady) {
        player.stopVideo();
        currentVideoId = null;
        document.querySelector('.status').textContent = "⏹️ Đã dừng phát.";
        document.querySelectorAll(".item button").forEach(b => b.classList.remove("playing"));
      }
    }

    // ==== Kiểm tra và load lại nếu mạng yếu ====
    function ensureYouTubeAPI() {
      if (!ytApiLoaded || typeof YT === "undefined" || !YT.Player) {
        console.warn("⚠️ API chưa sẵn sàng, đang reload...");
        loadYouTubeAPI();
      }
    }

    window.addEventListener("load", () => {
      loadYouTubeAPI();
      setTimeout(ensureYouTubeAPI, 3000);
      setTimeout(ensureYouTubeAPI, 6000);
    });
  </script>
</body>
</html>
