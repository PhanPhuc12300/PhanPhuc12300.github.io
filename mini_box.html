<head>

  <title>Mini Game Mở Quà</title>
  <style>
    body {
      background: radial-gradient(circle at top left, #1a1b2e, #0c0d1a);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .gift-box {
      position: relative;
      width: 150px;
      height: 120px;
      background: #ff2b2b;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 50, 50, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gift-box:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(255, 60, 60, 0.7);
    }

    .gift-lid {
      position: absolute;
      top: -40px;
      left: 0;
      width: 150px;
      height: 40px;
      background: #ff6f6f;
      border-radius: 10px 10px 0 0;
      transition: transform 0.5s ease;
      transform-origin: bottom center;
    }

    .open .gift-lid {
      transform: rotateX(150deg);
    }

    button {
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff4545, #ff7b7b);
      color: #fff;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s;
    }

    button:hover {
      background: linear-gradient(135deg, #ff7b7b, #ff4545);
      transform: scale(1.05);
    }

    #quote {
      margin-top: 40px;
      font-size: 20px;
      text-align: center;
      color: #eee;
      max-width: 600px;
      line-height: 1.5;
    }

    #author {
      margin-top: 10px;
      font-size: 16px;
      color: #aaa;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

    const gift = document.getElementById('gift');
    const openBtn = document.getElementById('openBtn');
    const quoteDiv = document.getElementById('quote');
    const authorDiv = document.getElementById('author');

    function showConfetti() {
      const duration = 2 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        const timeLeft = end - Date.now();
        if (timeLeft <= 0) return;
        requestAnimationFrame(frame);
      })();
    }

    function openGift() {
      gift.classList.add('open');
      showConfetti();

      const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
      quoteDiv.textContent = '“' + randomQuote.text + '”';
      authorDiv.textContent = '— ' + randomQuote.author;

      setTimeout(() => gift.classList.remove('open'), 1000);
    }

    openBtn.addEventListener('click', openGift);
    gift.addEventListener('click', openGift);
