<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Game Mở Quà — Vui Vẻ</title>
  <style>
    :root{
      --bg:#0f1226; --card:#0b1220; --accent:#ff4d4f; --glass: rgba(255,255,255,0.06);
      --glass2: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background: radial-gradient(1200px 600px at 10% 20%, #1b1430 0%, transparent 10%),
                  radial-gradient(900px 500px at 90% 80%, #112026 0%, transparent 10%),
                  var(--bg);
      color:#fff; display:flex; align-items:center; justify-content:center; padding:36px;
    }
    .wrap{width:980px; max-width:96%; display:grid; grid-template-columns: 1fr 360px; gap:24px; align-items:center}
    .stage{background:linear-gradient(180deg,var(--card), #07101a); border-radius:18px; padding:28px; box-shadow:0 8px 40px rgba(0,0,0,0.6); position:relative; overflow:hidden}
    .stage .scene{height:420px; display:flex; align-items:center; justify-content:center; position:relative}

    /* Gift box */
    .gift{width:220px; height:200px; position:relative; transform-origin:center bottom; cursor:pointer}
    .gift .box{width:100%; height:70%; background:linear-gradient(180deg,#ff2b2b 0%, #c10000 100%); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.5); position:absolute; bottom:0; left:0; display:flex; align-items:center; justify-content:center;}
    .gift .lid{width:240px; height:70px; background:linear-gradient(180deg,#ff4d4f 0%, #c83131 100%); border-radius:12px; position:absolute; top:0; left:50%; transform:translateX(-50%); transform-origin:center bottom; box-shadow:0 6px 20px rgba(0,0,0,0.4)}
    .ribbon{position:absolute; left:50%; top:36px; transform:translateX(-50%); width:20px; height:160px; background:linear-gradient(180deg,#ffc9c9,#ffefef); border-radius:8px}
    .ribbonX{position:absolute; left:0; top:40%; width:100%; height:20px; background:linear-gradient(90deg,#ffd6d6,#fff5f5); border-radius:8px}
    .bow{position:absolute; left:50%; top:8px; transform:translateX(-50%); width:80px; height:40px}
    .bow:before,.bow:after{content:''; position:absolute; width:42px; height:38px; background:linear-gradient(90deg,#fff,#ffdede); border-radius:12px}
    .bow:before{left:0; transform:rotate(-30deg);}
    .bow:after{right:0; transform:rotate(30deg)}
    .bow .knot{position:absolute; left:50%; top:8px; transform:translateX(-50%); width:18px; height:18px; border-radius:50%; background:#fff}

    /* Button column */
    .side{display:flex; flex-direction:column; gap:18px}
    .panel{background:var(--glass); border-radius:12px; padding:16px}
    h2{margin:0 0 6px 0; font-size:18px}
    p.small{margin:0;font-size:13px; color:#bcd}

    .btn{display:inline-block; user-select:none; background:linear-gradient(180deg,var(--accent), #b40000); padding:14px 20px; border-radius:12px; font-weight:700; cursor:pointer; box-shadow:0 8px 30px rgba(255,77,79,0.16); border:none; color:#fff}
    .btn:active{transform:translateY(2px)}
    .count{font-weight:700; font-size:20px; color:var(--accent)}

    /* message */
    .message{margin-top:18px; background:var(--glass2); padding:16px; border-radius:10px; min-height:110px; display:flex; align-items:center; justify-content:center; text-align:center}
    .quote{font-size:18px; line-height:1.3}
    .author{margin-top:8px; font-size:13px; opacity:0.8}

    /* confetti */
    .confetti{position:absolute; inset:0; pointer-events:none}
    .confetti span{position:absolute; width:10px; height:14px; opacity:0; display:block; transform-origin:center;}

    /* sparkle */
    .spark{position:absolute; width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.9); filter:blur(.5px); opacity:0}

    @keyframes popLid{0%{transform:translateY(0) rotate(0)} 40%{transform:translateY(-30px) rotate(-6deg)} 100%{transform:translateY(-140px) rotate(-20deg) }}
    @keyframes popLidBack{0%{transform:translateY(-140px) rotate(-20deg)} 100%{transform:translateY(-140px) rotate(-20deg)}}

    @media (max-width:880px){ .wrap{grid-template-columns:1fr; } .stage{order:2} .side{order:1} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <div class="scene">
        <div class="gift" id="gift" title="Nhấn để mở quà">
          <div class="lid" id="lid">
            <div class="bow"><span class="knot"></span></div>
          </div>
          <div class="ribbon"></div>
          <div class="ribbonX"></div>
          <div class="box"></div>
        </div>
        <div class="confetti" id="confetti"></div>
        <div class="spark" id="spark"></div>
      </div>
      <div class="panel" style="margin-top:16px">
        <div class="message" id="message">
          <div>
            <div class="quote" id="quote">Nhấn nút "Mở quà" hoặc bấm lên hộp quà để nhận một câu danh ngôn màu mè!</div>
            <div class="author" id="author"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <h2>Mini Game: Mở Quà</h2>
        <p class="small">Nhấn nút hoặc bấm vào hộp quà. Có thể mở nhiều lần.</p>
        <div style="display:flex; gap:12px; margin-top:12px; align-items:center;">
          <button class="btn" id="openBtn">🎁 Mở quà</button>
          <div style="margin-left:auto; text-align:right">
            <div style="font-size:12px; color:#bcd">Đã mở</div>
            <div class="count" id="count">0</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Gợi ý</h2>
        <p class="small">Bạn có thể mở lại nhiều lần để xem danh ngôn khác nhau. Nếu muốn, nhờ tớ thêm màu, hiệu ứng hay chuyển ngôn ngữ nhé!</p>
      </div>
    </div>
  </div>

  <script>

      {t: "Không gian cho trí tưởng tượng là nơi ý tưởng lớn xuất hiện.", a: "Unknown"},
      {t: "Cuộc sống là nghệ thuật của sự lựa chọn.", a: "Unknown"},

      {t: "Thử thách là cơ hội ngụy trang.", a: "Oprah Winfrey"},
      {t: "Chúng ta là những gì ta lặp lại mỗi ngày.", a: "Aristotle"},
      {t: "Điều duy nhất cố định là sự thay đổi.", a: "Heraclitus"},
      {t: "Tin vào bản thân là bước đầu tiên dẫn đến thành công.", a: "Unknown"},
      {t: "Học viện không phải lúc nào cũng dạy sự sống.", a: "Unknown"},
      {t: "Năng lượng bạn bỏ ra quyết định kết quả bạn nhận.", a: "Unknown"},
      {t: "Trí tuệ là biết cái đúng, phẩm cách là làm cái đúng.", a: "Unknown"},
      {t: "Không có con đường tắt đến bất cứ nơi nào đáng đến.", a: "Beverly Sills"},

      {t: "Trong im lặng có sức mạnh.", a: "Lao Tzu"},
      {t: "Cứ tiếp tục bước, dù chậm, miễn là không dừng lại.", a: "Confucius"},
      {t: "Nghệ thuật sống là biết lựa chọn ưu tiên.", a: "Unknown"},

      {t: "Sự hào phóng là bản chất của tâm hồn lớn.", a: "Unknown"},

      {t: "Kỷ niệm đẹp là tài sản vô giá.", a: "Unknown"},

      {t: "Sự tò mò đem ta tới khám phá vĩ đại.", a: "Unknown"},

      {t: "Hãy mỉm cười dù ngày mai chưa chắc tốt hơn.", a: "Unknown"},
      {t: "Tôn trọng người khác là tôn trọng chính mình.", a: "Unknown"},
      {t: "Sự khác biệt tạo ra giá trị.", a: "Unknown"},
      {t: "Hãy làm từng việc nhỏ với tình yêu lớn.", a: "Mother Teresa"},
      {t: "Một ý tưởng tốt có thể thay đổi thế giới.", a: "Unknown"},
      {t: "Tập trung vào hành trình chứ không chỉ đích đến.", a: "Unknown"},
      {t: "Lòng biết ơn biến những gì ta có thành đủ.", a: "Unknown"},
      {t: "Giá trị thực sự không thể cân đo bằng tiền.", a: "Unknown"},
      {t: "Hãy sống sao cho ngày mai không hối tiếc.", a: "Unknown"},
      {t: "Bạn là người quyết định câu chuyện cuộc đời mình.", a: "Unknown"}
    ];

    // UI refs
    const openBtn = document.getElementById('openBtn');
    const gift = document.getElementById('gift');
    const lid = document.getElementById('lid');
    const confetti = document.getElementById('confetti');
    const quoteEl = document.getElementById('quote');
    const authorEl = document.getElementById('author');
    const countEl = document.getElementById('count');

    let opened = 0;
    let animating = false;

    function randInt(n){return Math.floor(Math.random()*n)}

    function showQuote(){
      const idx = randInt(QUOTES.length);
      const q = QUOTES[idx];
      quoteEl.textContent = '“' + q.t + '”';
      authorEl.textContent = q.a ? ('— ' + q.a) : '';
    }

    function burstConfetti(){
      confetti.innerHTML='';
      const colors = ['#ff3b3b','#ffd63b','#32d6a6','#6fb3ff','#c66bff','#ff7ab6'];
      const n = 36;
      for(let i=0;i<n;i++){
        const s = document.createElement('span');
        s.style.left = '50%'; s.style.top = '40%';
        s.style.transform = 'translate(-50%,-50%) rotate('+ (randInt(360)) +'deg)';
        const w = 8 + randInt(10);
        s.style.width = w+'px'; s.style.height = (w+4)+'px';
        s.style.background = colors[randInt(colors.length)];
        s.style.borderRadius = (randInt(50)>30? '4px':'50%');
        s.style.opacity = '1';
        confetti.appendChild(s);
        const ang = (Math.PI*2) * (i/n);
        const dist = 120 + randInt(200);
        const tx = Math.cos(ang)*dist + (randInt(40)-20);
        const ty = Math.sin(ang)*dist + (randInt(60)-30) - 40;
        s.animate([
          {transform: 'translate(-50%,-50%) rotate('+randInt(360)+'deg)', opacity:1},
          {transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${randInt(720)}deg)`, opacity:0}
        ],{duration:900+randInt(600), easing:'cubic-bezier(.17,.67,.23,.98)'});
      }
    }

    function sparkle(){
      const sp = document.getElementById('spark');
      sp.style.left = (30 + randInt(60)) + '%';
      sp.style.top = (20 + randInt(60)) + '%';
      sp.style.opacity = 1; sp.style.transform = 'scale(0.2)';
      sp.animate([{opacity:1, transform:'scale(0.2)'},{opacity:0, transform:'scale(2)'}],{duration:800, easing:'ease-out'});
    }

    function openGift(){
      if(animating) return;
      animating = true;
      opened++;
      countEl.textContent = opened;

      // lid animation
      lid.style.transition = 'transform 600ms cubic-bezier(.17,.67,.23,.98)';
      lid.style.transform = 'translateY(-140px) rotate(-20deg)';

      // scale box little
      gift.animate([{transform:'scale(1)'},{transform:'scale(0.98)'},{transform:'scale(1)'}],{duration:700, easing:'ease-out'});

      // confetti + sparkle
      setTimeout(()=>{ burstConfetti(); sparkle(); showQuote(); }, 180);

      // small fireworks
      setTimeout(()=>{ lid.style.transform = 'translateY(-140px) rotate(-20deg)'; }, 600);

      // done
      setTimeout(()=>{ animating=false; }, 1200);
    }

    openBtn.addEventListener('click', openGift);
    gift.addEventListener('click', openGift);

    // keyboard shortcut: space
    window.addEventListener('keydown', (e)=>{ if(e.code==='Space'){ e.preventDefault(); openGift(); } });

    // initial little idle motion
    setInterval(()=>{
      if(!animating){ gift.animate([{transform:'translateY(0)'},{transform:'translateY(-6px)'},{transform:'translateY(0)'}],{duration:2500, easing:'ease-in-out'}); }
    }, 3000);
