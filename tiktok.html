<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Nhúng video TikTok</title>
  <style>
    body {
      background: linear-gradient(45deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    /* Bọc tất cả video lại trong 1 hàng */
    .videos-row {
      display: flex;
      flex-wrap: wrap;        /* đủ chỗ thì nằm ngang, thiếu thì xuống dòng */
      justify-content: center; /* căn giữa */
      gap: 20px;               /* khoảng cách giữa các video */
    }

    .video-container {
      background: white;
      border: 5px solid #ff6ec7;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 0, 150, 0.6);
      padding: 20px;
      animation: glow 2s infinite alternate;
      flex: 0 1 350px; /* video rộng khoảng 350px, tự co giãn khi cần */
    }

    @keyframes glow {
      from { box-shadow: 0 0 20px #ff6ec7; }
      to { box-shadow: 0 0 40px #6ec7ff; }
    }

    h1 {
      color: #fff;
      text-shadow: 2px 2px 5px #000;
    }
  </style>
</head>
<body>
  <h1>✨ Video TikTok nổi bật ✨</h1>

  <div class="videos-row">
    <div class="video-container">
      <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@_arikito/video/7527494402042776839" data-video-id="7527494402042776839" style="width: 100%; min-width: 250px; max-width: 100%;"></blockquote>
    </div>

    <div class="video-container">
      <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@_lecwong.2809/video/7534506277364452616" data-video-id="7534506277364452616" style="width: 100%; min-width: 250px; max-width: 100%;"></blockquote>
    </div>

    <div class="video-container">
      <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@_lecwong.2809/video/7531180702503668999" data-video-id="7531180702503668999" style="width: 100%; min-width: 250px; max-width: 100%;"></blockquote>
    </div>
  </div>

  <!-- Chỉ cần 1 script cuối -->
  <script async src="https://www.tiktok.com/embed.js"></script>
</body>
</html>
