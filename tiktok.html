<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Nhúng video TikTok</title>
  <style>
    body {
      background: linear-gradient(45deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    .video-container {
      background: white;
      border: 5px solid #ff6ec7;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 0, 150, 0.6);
      display: inline-block;
      padding: 20px;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 0 20px #ff6ec7; }
      to { box-shadow: 0 0 40px #6ec7ff; }
    }
    h1 {
      color: #fff;
      text-shadow: 2px 2px 5px #000;
    }
  </style>
</head>
<body>
  <h1>✨ Video TikTok nổi bật ✨</h1>
  <div class="video-container">
    <!-- Thay đường link TikTok này bằng link video thật -->
    
    <blockquote 
  class="tiktok-embed" 
  cite="https://www.tiktok.com/@_arikito/video/7527494402042776839" 
  data-video-id="7527494402042776839" 
  style="width: 100%; max-width: 400px; min-width: 250px; margin: auto;">
</blockquote>
<script async src="https://www.tiktok.com/embed.js"></script>

  </div>
</body>
</html>
