<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Nhúng video TikTok</title>
  <style>
    body {
      background: linear-gradient(45deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
/*     .video-container {
      background: white;
      border: 5px solid #ff6ec7;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 0, 150, 0.6);
      display: inline-block;
      padding: 20px;
      animation: glow 2s infinite alternate;
    } */
    @keyframes glow {
      from { box-shadow: 0 0 20px #ff6ec7; }
      to { box-shadow: 0 0 40px #6ec7ff; }
    }
    h1 {
      color: #fff;
      text-shadow: 2px 2px 5px #000;
    }
  </style>
</head>
<body>
  <h1>✨ Video TikTok nổi bật ✨</h1>
  <div class="video-container">
    
<!--     <iframe
      src="https://www.tiktok.com/player/v1/7535451015924026632"
      width="325"
      height="575"
      frameborder="0"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe> -->
    <div id="videos"></div>
    <script>
    const ids = [
      "7542016712430914837",
      "7527170266166873352",
      "7534506277364452616",
      "7531180702503668999",
      "7523902137236016402",
      "7536520030880582930",
      "7524914036312427783",
      "7542016712430914837",
      "7535451015924026632"
    ];
    
    const container = document.getElementById("videos");
    
    ids.forEach(id => {
      const iframe = document.createElement("iframe");
      iframe.src = `https://www.tiktok.com/player/v1/${id}`;
      iframe.width = "325";
      iframe.height = "575";
      iframe.frameBorder = "0";
      iframe.allow = "autoplay; encrypted-media; picture-in-picture";
      iframe.allowFullscreen = true;
      iframe.style.margin = "10px";
      container.appendChild(iframe);
    });
    </script>

    <script>
      window.addEventListener('message', e => {
      });
      function seekTo(seconds) {
        const iframe = document.querySelector('iframe');
        iframe.contentWindow.postMessage({ type: 'seekTo', value: seconds, 'x-tiktok-player': true }, '*');
      }
    </script>

    
  </div>
</body>
</html>
