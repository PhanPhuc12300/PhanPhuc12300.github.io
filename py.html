<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Brython + CSS demo</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #89f7fe, #66a6ff);
      text-align: center;
      padding-top: 50px;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: inline-block;
      min-width: 300px;
    }
    .result {
      margin-top: 15px;
      font-size: 1.2em;
      font-weight: bold;
      color: #ff4b5c;
    }
  </style>
</head>
<body onload="brython()">

<div class="box">
  <h2>Kiểm tra ngày</h2>
  <div id="output" class="result"></div>
</div>

<script type="text/python">
from datetime import date
from browser import document

today = date.today()
target = date(2025, 9, 20)

if today >= target:
    result = "Hôm nay là ngày 20/9/2025 hoặc sau ngày đó."
else:
    result = "Hôm nay vẫn trước ngày 20/9/2025."

document["output"].text = result
</script>

</body>
</html>
