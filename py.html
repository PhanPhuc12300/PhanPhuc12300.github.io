<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Python IDE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas;
}

body{
    background:#0f1117;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:50px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    padding:0 20px;
    color:white;
}

.container{
    flex:1;
    display:flex;
}

.editor{
    width:50%;
    background:#0d1117;
    border-right:1px solid #30363d;
    display:flex;
    flex-direction:column;
}

.editor-header{
    padding:10px;
    color:#58a6ff;
    border-bottom:1px solid #30363d;
}

textarea{
    flex:1;
    background:#0d1117;
    color:#e6edf3;
    border:none;
    outline:none;
    resize:none;
    padding:20px;
    font-size:15px;
    line-height:1.5;
}

.terminal{
    width:50%;
    background:black;
    color:#00ff88;
    display:flex;
    flex-direction:column;
}

.terminal-header{
    padding:10px;
    background:#111;
    border-bottom:1px solid #333;
}

.output{
    flex:1;
    padding:20px;
    overflow:auto;
    white-space:pre-wrap;
}

.run-btn{
    background:#238636;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    margin-left:10px;
}

.run-btn:hover{
    background:#2ea043;
}
</style>
</head>

<body>

<div class="topbar">
    Python Web IDE
    <button class="run-btn" onclick="runCode()">Run</button>
</div>

<div class="container">

    <div class="editor">
        <div class="editor-header">
            main.py
        </div>

<textarea id="code">
print("Hello World")

for i in range(5):
    print(i)
</textarea>
    </div>

    <div class="terminal">
        <div class="terminal-header">
            CMD / Terminal
        </div>

        <div class="output" id="output">
Python 3.12 Ready...
        </div>
    </div>

</div>

<script>
function runCode(){

    let code = document.getElementById("code").value;
    let output = document.getElementById("output");

    output.innerHTML =
`> Running Python...

${code}

(Chỗ này cần Pyodide hoặc backend để chạy thật)`;
}
</script>

</body>
</html>
