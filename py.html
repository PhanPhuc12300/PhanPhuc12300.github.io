<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Web IDE</title>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"></script>

  <style>
    :root{
      --bg:#0b1020;
      --panel:#10182d;
      --panel-2:#0d1426;
      --line:#23304f;
      --text:#e8eefc;
      --muted:#8ea0c6;
      --accent:#7c8cff;
      --accent-2:#5eead4;
      --good:#22c55e;
      --bad:#ef4444;
      --warn:#f59e0b;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --radius: 18px;
      --mono: Consolas, "Cascadia Mono", "Fira Code", Menlo, Monaco, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      background:
        radial-gradient(1000px 600px at 20% 0%, rgba(124,140,255,.15), transparent 50%),
        radial-gradient(900px 500px at 90% 10%, rgba(94,234,212,.10), transparent 45%),
        linear-gradient(180deg, #08101f 0%, #060b16 100%);
      color:var(--text);
      font-family:var(--sans);
      overflow:hidden;
    }

    .app{
      height:100vh;
      display:flex;
      flex-direction:column;
      padding:16px;
      gap:16px;
    }

    .topbar{
      height:64px;
      flex:0 0 64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      background:rgba(16,24,45,.82);
      border:1px solid rgba(124,140,255,.18);
      border-radius:var(--radius);
      backdrop-filter: blur(14px);
      box-shadow:var(--shadow);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .logo{
      width:38px;
      height:38px;
      border-radius:12px;
      background:linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow:0 8px 24px rgba(124,140,255,.32);
      flex:0 0 auto;
    }

    .brand h1{
      margin:0;
      font-size:16px;
      font-weight:700;
      letter-spacing:.2px;
      line-height:1.1;
    }

    .brand .sub{
      display:block;
      margin-top:3px;
      font-size:12px;
      color:var(--muted);
      font-weight:500;
    }

    .status{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:13px;
      color:var(--muted);
      white-space:nowrap;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#667085;
      box-shadow:0 0 0 4px rgba(102,112,133,.12);
    }

    .dot.ready{ background:var(--good); box-shadow:0 0 0 4px rgba(34,197,94,.12); }
    .dot.loading{ background:var(--warn); box-shadow:0 0 0 4px rgba(245,158,11,.12); }
    .dot.error{ background:var(--bad); box-shadow:0 0 0 4px rgba(239,68,68,.12); }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    button{
      border:none;
      outline:none;
      cursor:pointer;
      font:inherit;
      border-radius:12px;
      padding:11px 14px;
      transition:.18s ease;
      user-select:none;
    }

    .btn-primary{
      background:linear-gradient(135deg, var(--accent), #5b6cff);
      color:white;
      font-weight:700;
      box-shadow:0 10px 24px rgba(92,108,255,.25);
    }
    .btn-primary:hover{ transform:translateY(-1px); filter:brightness(1.06); }

    .btn-ghost{
      background:rgba(255,255,255,.06);
      color:var(--text);
      border:1px solid rgba(255,255,255,.08);
    }
    .btn-ghost:hover{ background:rgba(255,255,255,.1); }

    .workspace{
      flex:1;
      display:grid;
      grid-template-rows: 1.4fr .9fr;
      gap:16px;
      min-height:0;
    }

    .editor-wrap,
    .terminal-wrap{
      min-height:0;
      background:rgba(16,24,45,.78);
      border:1px solid rgba(124,140,255,.16);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(14px);
    }

    .panel-head{
      height:48px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:rgba(255,255,255,.02);
      color:var(--muted);
      font-size:13px;
    }

    .panel-head .left,
    .panel-head .right{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .chip{
      padding:6px 10px;
      border-radius:999px;
      background:rgba(124,140,255,.11);
      color:#bfc7ff;
      border:1px solid rgba(124,140,255,.18);
      font-family:var(--mono);
      font-size:12px;
    }

    .editor-area{
      height:calc(100% - 48px);
      display:flex;
      min-height:0;
    }

    .gutter{
      width:56px;
      padding:16px 10px 16px 0;
      background:rgba(255,255,255,.02);
      color:#5f739a;
      font-family:var(--mono);
      font-size:13px;
      line-height:1.65;
      text-align:right;
      overflow:hidden;
      border-right:1px solid rgba(255,255,255,.05);
      user-select:none;
    }

    .editor{
      flex:1;
      width:100%;
      border:none;
      outline:none;
      resize:none;
      padding:16px 18px;
      background:transparent;
      color:var(--text);
      font-family:var(--mono);
      font-size:14px;
      line-height:1.65;
      tab-size:4;
      caret-color:#ffffff;
      overflow:auto;
      white-space:pre;
    }

    .editor::selection{ background:rgba(124,140,255,.28); }

    .terminal{
      height:calc(100% - 48px);
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .terminal-output{
      flex:1;
      padding:16px 18px;
      overflow:auto;
      font-family:var(--mono);
      font-size:13px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break:break-word;
      background:
        linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.24)),
        radial-gradient(800px 300px at 10% 0%, rgba(94,234,212,.07), transparent 55%);
    }

    .line{
      margin:0 0 4px 0;
    }

    .prompt{ color:#9ee7ff; }
    .ok{ color:#8ff2a8; }
    .err{ color:#ff8f8f; }
    .hint{ color:#9caecf; }

    .footerbar{
      height:42px;
      flex:0 0 42px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 14px;
      border-top:1px solid rgba(255,255,255,.06);
      background:rgba(255,255,255,.02);
      color:var(--muted);
      font-size:12px;
    }

    .kbd{
      display:inline-block;
      padding:3px 7px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      color:#d8e2ff;
      font-family:var(--mono);
      font-size:11px;
      margin:0 2px;
    }

    @media (max-width: 900px){
      body{ overflow:auto; }
      .app{ height:auto; min-height:100vh; }
      .workspace{ grid-template-rows: 1.15fr .85fr; }
      .topbar{ height:auto; padding:14px; gap:12px; flex-wrap:wrap; }
      .status{ order:3; width:100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1>Python Web IDE <span class="sub">Editor ở trên, terminal ở dưới</span></h1>
        </div>
      </div>

      <div class="status">
        <span id="statusDot" class="dot loading"></span>
        <span id="statusText">Đang nạp Pyodide...</span>
      </div>

      <div class="actions">
        <button class="btn-ghost" id="exampleBtn">Mẫu code</button>
        <button class="btn-ghost" id="clearBtn">Xoá terminal</button>
        <button class="btn-primary" id="runBtn">Run Python</button>
      </div>
    </div>

    <div class="workspace">
      <section class="editor-wrap">
        <div class="panel-head">
          <div class="left">
            <span class="chip">main.py</span>
            <span>Tự động lưu vào trình duyệt</span>
          </div>
          <div class="right">
            <span class="hint">Ctrl + Enter để chạy</span>
          </div>
        </div>

        <div class="editor-area">
          <div id="gutter" class="gutter">1</div>
          <textarea id="editor" class="editor" spellcheck="false" wrap="off"></textarea>
        </div>
      </section>

      <section class="terminal-wrap">
        <div class="panel-head">
          <div class="left">
            <span class="chip">terminal</span>
            <span>Output chạy Python</span>
          </div>
          <div class="right">
            <span class="hint">y như console</span>
          </div>
        </div>

        <div class="terminal">
          <div id="terminal" class="terminal-output"></div>
          <div class="footerbar">
            <div>Chạy bằng <b>Pyodide</b> trong trình duyệt</div>
            <div><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const editor = document.getElementById("editor");
    const terminal = document.getElementById("terminal");
    const gutter = document.getElementById("gutter");
    const runBtn = document.getElementById("runBtn");
    const clearBtn = document.getElementById("clearBtn");
    const exampleBtn = document.getElementById("exampleBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    let pyodide = null;
    let isReady = false;

    const DEFAULT_CODE = `print("Xin chào từ Python trong trình duyệt!")\n\nfor i in range(1, 6):\n    print("Số", i)\n\nname = "cậu"\nprint(f"Hello, {name}!")\n`;

    function setStatus(type, text){
      statusDot.className = "dot " + type;
      statusText.textContent = text;
    }

    function escapeHtml(str){
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function appendTerminal(text, cls = ""){
      const div = document.createElement("div");
      div.className = "line " + cls;
      div.innerHTML = escapeHtml(text);
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function clearTerminal(){
      terminal.innerHTML = "";
    }

    function updateGutter(){
      const lines = editor.value.split("\n").length || 1;
      let out = "";
      for(let i = 1; i <= lines; i++) out += i + (i < lines ? "\n" : "");
      gutter.textContent = out;
    }

    function saveDraft(){
      localStorage.setItem("python_web_ide_draft", editor.value);
    }

    function loadDraft(){
      const saved = localStorage.getItem("python_web_ide_draft");
      editor.value = saved !== null ? saved : DEFAULT_CODE;
      updateGutter();
    }

    async function initPyodide(){
      try{
        setStatus("loading", "Đang nạp Pyodide...");
        pyodide = await loadPyodide();
        isReady = true;
        setStatus("ready", "Sẵn sàng");
        appendTerminal("Python web IDE đã sẵn sàng.", "ok");
        appendTerminal("Gõ code ở khung trên rồi bấm Run.", "hint");
      }catch(err){
        console.error(err);
        setStatus("error", "Không nạp được Pyodide");
        appendTerminal("Lỗi khi nạp Pyodide: " + err.message, "err");
      }
    }

    async function runCode(){
      if(!isReady || !pyodide){
        appendTerminal("Chưa sẵn sàng. Đang nạp môi trường...", "hint");
        return;
      }

      const code = editor.value;
      clearTerminal();
      appendTerminal(">>> Running Python...", "prompt");

      try{
        pyodide.globals.set("user_code", code);
        pyodide.globals.set("js_write", (text) => {
          terminal.appendChild(document.createTextNode(String(text)));
          terminal.scrollTop = terminal.scrollHeight;
        });

        const wrapper = `
import sys, traceback
from js import js_write

class _Writer:
    def write(self, s):
        js_write(str(s))
    def flush(self):
        pass

old_stdout = sys.stdout
old_stderr = sys.stderr
sys.stdout = _Writer()
sys.stderr = _Writer()

try:
    exec(user_code, {})
except SystemExit:
    pass
except Exception:
    traceback.print_exc()
finally:
    sys.stdout = old_stdout
    sys.stderr = old_stderr
`;

        await pyodide.runPythonAsync(wrapper);
        appendTerminal("\n\n[Done]", "ok");
      }catch(err){
        appendTerminal("\n\n[JavaScript error] " + err.message, "err");
      }finally{
        terminal.scrollTop = terminal.scrollHeight;
      }
    }

    function loadExample(){
      editor.value =
`# Ví dụ: tính giai thừa và in bảng
def factorial(n):
    res = 1
    for i in range(2, n + 1):
        res *= i
    return res

print("Bảng giai thừa:")
for n in range(1, 8):
    print(n, "=>", factorial(n))

print("\\nXong!")`;
      updateGutter();
      saveDraft();
    }

    editor.addEventListener("input", () => {
      updateGutter();
      saveDraft();
    });

    editor.addEventListener("scroll", () => {
      gutter.scrollTop = editor.scrollTop;
    });

    editor.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const value = editor.value;
        editor.value = value.slice(0, start) + "    " + value.slice(end);
        editor.selectionStart = editor.selectionEnd = start + 4;
        updateGutter();
        saveDraft();
      }

      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        runCode();
      }
    });

    runBtn.addEventListener("click", runCode);
    clearBtn.addEventListener("click", clearTerminal);
    exampleBtn.addEventListener("click", loadExample);

    loadDraft();
    updateGutter();
    clearTerminal();
    appendTerminal("Đang khởi tạo môi trường...", "hint");
    initPyodide();
  </script>
</body>
</html>
