<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gõ số π kiểu ChatGPT 🌈</title>
<style>
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: "Consolas", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    color: #ff79c6;
  }
  button {
    background: #1f6feb;
    border: none;
    padding: 10px 20px;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 10px;
    transition: 0.2s;
  }
  button:hover {
    background: #388bfd;
  }
  #pi-container {
    background: #161b22;
    border-radius: 10px;
    padding: 20px;
    width: 90%;
    max-width: 800px;
    font-size: 18px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-y: auto;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
  }
  #progress {
    width: 90%;
    max-width: 800px;
    height: 10px;
    border-radius: 5px;
    background: #30363d;
    margin-top: 15px;
    overflow: hidden;
  }
  #progress-bar {
    height: 10px;
    width: 0%;
    background: linear-gradient(90deg, #ff79c6, #8be9fd, #50fa7b);
    transition: width 0.2s;
  }
</style>
</head>
<body>
  <h1>π Typing Demo ✨</h1>
  <p>Nhấn "Bắt đầu" để tính π và hiển thị dần theo kiểu gõ 👇</p>
  <button id="start">Bắt đầu</button>
  <div id="progress"><div id="progress-bar"></div></div>
  <pre id="pi-container">Ấn "Bắt đầu" để khởi động...</pre>

<script>
// ----------------------
// Tính gần đúng số π
// ----------------------
function calculatePi(terms = 2000) {
  let pi = 0;
  let n = 1;
  for (let i = 0; i < terms; i++) {
    pi += 4 / n - 4 / (n + 2);
    n += 4;
  }
  return pi.toFixed(terms > 10 ? 1000 : terms);
}

// ----------------------
// Hiệu ứng gõ từng ký tự
// ----------------------
async function displayTyping(piText) {
  const piContainer = document.getElementById("pi-container");
  const progressBar = document.getElementById("progress-bar");
  piContainer.innerHTML = "";
  
  let i = 0;
  const delay = 5; // ms giữa mỗi ký tự
  const total = piText.length;

  async function type() {
    if (i < total) {
      const color = `hsl(${(i * 3) % 360}, 70%, 65%)`;
      piContainer.innerHTML += `<span style="color:${color}">${piText[i]}</span>`;
      i++;
      progressBar.style.width = ((i / total) * 100) + "%";
      await new Promise(r => setTimeout(r, delay));
      requestAnimationFrame(type);
    } else {
      progressBar.style.width = "100%";
    }
  }

  type();
}

// ----------------------
// Nút bắt đầu
// ----------------------
document.getElementById("start").addEventListener("click", async () => {
  const piContainer = document.getElementById("pi-container");
  piContainer.textContent = "Đang tính số π...";

  // Tính π (dùng thuật toán Leibniz đơn giản để demo)
  const pi = calculatePi(50000); // có thể tăng/giảm số vòng lặp
  piContainer.textContent = "Đang in theo kiểu gõ...";
  await new Promise(r => setTimeout(r, 500));

  // Gõ từng ký tự
  displayTyping(pi);
});
</script>
</body>
</html>
