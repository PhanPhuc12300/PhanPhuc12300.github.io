<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>🎧 Music Player</title>
<style>
  body {
    font-family: "Poppins", sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #5b2be0, #ff73fa, #00d4ff);
    background-size: 400% 400%;
    animation: gradient 10s ease infinite;
    color: white;
  }
  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    padding: 12px 24px;
    margin: 10px;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: 0.3s;
  }
  button:hover {
    background: rgba(255,255,255,0.4);
    transform: scale(1.05);
  }
  iframe {
    display: none;
  }
</style>
</head>
<body>

<h1>🎶 Music Galaxy Player 🎶</h1>
<p>Chọn một bài để chill nào ✨</p>

<button onclick="playSong('XkTeWGozEQA')">🎧 Lofi Chill</button>
<button onclick="playSong('DWcJFNfaw9c')">🌌 Galaxy Vibes</button>
<button onclick="playSong('O7O4Ygzkx9o')">☁️ Night Rain</button>
<button onclick="pauseSong()">⏸ Dừng nhạc</button>

<iframe id="player" 
        allow="autoplay; encrypted-media"
        frameborder="0"></iframe>

<script>
let currentVideo = "";
function playSong(videoId) {
  const iframe = document.getElementById("player");
  if (currentVideo === videoId) return; // Nếu đang phát bài đó thì bỏ qua
  iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&loop=1&playlist=${videoId}`;
  iframe.style.display = "block";
  currentVideo = videoId;
}
function pauseSong() {
  const iframe = document.getElementById("player").contentWindow;
  iframe.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
}
</script>

<p style="position:fixed;bottom:10px;width:100%;font-size:12px;opacity:0.7;">
💫 Code by PhanPhuc12300
</p>

</body>
</html>
