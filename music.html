<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎶 Music Galaxy Player</title>
<style>
  /* Hiệu ứng nền chuyển màu liên tục */
  body {
    font-family: "Poppins", sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #2b1055, #7597de, #ff8cf3, #3b2ae0);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    color: white;
    overflow-x: hidden;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    font-size: 36px;
    margin-top: 40px;
    text-shadow: 0 0 10px rgba(255,255,255,0.8);
  }

  p {
    font-size: 18px;
    margin-bottom: 30px;
    opacity: 0.9;
  }

  button {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: white;
    padding: 14px 30px;
    margin: 12px;
    font-size: 18px;
    border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  button:hover {
    background: rgba(255,255,255,0.4);
    transform: scale(1.05);
  }

  iframe {
    display: none;
    width: 0;
    height: 0;
  }

  /* Dòng credit nhỏ bên dưới */
  footer {
    position: fixed;
    bottom: 10px;
    width: 100%;
    font-size: 13px;
    opacity: 0.6;
    letter-spacing: 0.5px;
  }

  /* Hiệu ứng sao bay nhẹ */
  .stars {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("https://i.imgur.com/2nCt3Sbl.jpg") repeat;
    background-size: cover;
    z-index: -1;
    animation: moveStars 100s linear infinite;
    opacity: 0.3;
  }

  @keyframes moveStars {
    from { background-position: 0 0; }
    to { background-position: -10000px 5000px; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<h1>🌌 Music Galaxy Player</h1>
<p>Chọn một bài để chill cùng bầu trời sao ✨</p>

<!-- Nút phát nhạc -->
<button onclick="playSong('XkTeWGozEQA')">Phép Màu (Đàn Cá Gỗ OST) SArisu</button>
<button onclick="playSong('1-wcMYSUBgk')">Muộn Rồi Mà Sao Còn - Sơn Tùng M-TP</button>
<!-- <button onclick="playSong('O7O4Ygzkx9o')">🌧️ Rainy Mood</button> -->
<button onclick="pauseSong()">⏸ Dừng nhạc</button>

<!-- Khung ẩn phát YouTube -->
<iframe id="player" allow="autoplay; encrypted-media" frameborder="0"></iframe>

<script>
let currentVideo = "";
function playSong(videoId) {
  const iframe = document.getElementById("player");
  // Nếu đang phát cùng video thì không reload lại
  if (currentVideo === videoId) return;
  iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&loop=1&playlist=${videoId}`;
  iframe.style.display = "block";
  currentVideo = videoId;
}

function pauseSong() {
  const iframe = document.getElementById("player").contentWindow;
  iframe.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
}
</script>

<footer>💫 Miền và code được làm bởi <b>PhanPhuc12300</b></footer>

</body>
</html>
