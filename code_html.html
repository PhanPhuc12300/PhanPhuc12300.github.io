<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCode Studio</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #1e1e1e;
    color: #cccccc;
}

/* APP */
.app {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* ACTIVITY BAR */
.activity {
    width: 52px;
    background: #181818;
    border-right: 1px solid #2b2b2b;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.activity-icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    color: #888;
    cursor: pointer;
}

.activity-icon.active {
    color: white;
    border-left: 2px solid #007acc;
    background: #222;
}

/* SIDEBAR */
.sidebar {
    width: 230px;
    background: #181818;
    border-right: 1px solid #2b2b2b;
}

.sidebar-title {
    height: 42px;
    display: flex;
    align-items: center;
    padding-left: 18px;
    font-size: 12px;
    color: #bbb;
    letter-spacing: .5px;
}

.folder {
    padding: 8px 14px;
    font-size: 13px;
    color: #ddd;
}

.file {
    height: 30px;
    display: flex;
    align-items: center;
    padding-left: 28px;
    gap: 7px;
    cursor: pointer;
}

.file:hover {
    background: #2a2d2e;
}

.file.active {
    background: #37373d;
    color: white;
}

.html-icon {
    color: #e44d26;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* TOP */
.topbar {
    height: 36px;
    background: #252526;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #181818;
}

.tab {
    height: 36px;
    min-width: 150px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1e1e1e;
    border-right: 1px solid #2b2b2b;
    font-size: 13px;
}

.tab .close {
    margin-left: auto;
    color: #999;
}

/* TOOLBAR */
.toolbar {
    height: 42px;
    background: #252526;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
}

button {
    border: none;
    cursor: pointer;
}

.run {
    background: #16825d;
    color: white;
    padding: 7px 14px;
    border-radius: 4px;
    font-size: 13px;
}

.run:hover {
    background: #1b9b6f;
}

.clear {
    background: #3a3d41;
    color: #ddd;
    padding: 7px 12px;
    border-radius: 4px;
}

.toolbar-info {
    margin-left: auto;
    color: #777;
    font-size: 12px;
}

/* WORKSPACE */
.workspace {
    flex: 1;
    display: flex;
    min-height: 0;
}

.editor-area {
    width: 58%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
}

.preview-area {
    flex: 1;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-left: 1px solid #333;
}

.panel-title {
    height: 30px;
    background: #252526;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 12px;
    color: #aaa;
    border-bottom: 1px solid #333;
}

#editor {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: 100%;
}

/* PREVIEW */
#preview {
    width: 100%;
    height: 100%;
    border: none;
    background: white;
}

/* STATUS */
.statusbar {
    height: 22px;
    background: #007acc;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 10px;
    font-size: 11px;
}

.status-right {
    margin-left: auto;
    display: flex;
    gap: 18px;
}
</style>

</head>

<body>

<div class="app">

<h1>Hello World!</h1>

<p>Đây là VS Code mini 😎</p>

<button onclick="hello()">
    Click me
</button>

<script>
require.config({
    paths: {
        vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs"
    }
});

require(["vs/editor/editor.main"], function () {

    const defaultCode = `<!DOCTYPE html>
<html>
<head>
    <title>WebCode Studio</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: cyan;
        }
    </style>
</head>

<body>

    <h1>Hello World!</h1>

    <p>Code thử ở đây 😎</p>

    <button onclick="hello()">
        Click me
    </button>

    <script>
        function hello() {
            alert("Hello cậu!");
        }
    <\/script>

</body>
</html>`;

    editor = monaco.editor.create(
        document.getElementById("editor"),
        {
            value: defaultCode,

            language: "html",

            theme: "vs-dark",

            automaticLayout: true,

            fontSize: 14,

            fontFamily: "Consolas, monospace",

            tabSize: 4,

            minimap: {
                enabled: true
            },

            wordWrap: "off",

            suggestOnTriggerCharacters: true,

            quickSuggestions: true,

            parameterHints: {
                enabled: true
            },

            autoClosingBrackets: "always",

            autoClosingQuotes: "always",

            autoIndent: "full",

            bracketPairColorization: {
                enabled: true
            }
        }
    );

    // Ctrl + Enter để chạy
    editor.addCommand(
        monaco.KeyMod.Ctrl | monaco.KeyCode.Enter,
        function () {
            runCode();
        }
    );

    // Chạy lần đầu
    runCode();

});
</script>

</body>
