<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCode Studio</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #1e1e1e;
    color: #cccccc;
}

/* APP */
.app {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* ACTIVITY BAR */
.activity {
    width: 52px;
    background: #181818;
    border-right: 1px solid #2b2b2b;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.activity-icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    color: #888;
    cursor: pointer;
}

.activity-icon.active {
    color: white;
    border-left: 2px solid #007acc;
    background: #222;
}

/* SIDEBAR */
.sidebar {
    width: 230px;
    background: #181818;
    border-right: 1px solid #2b2b2b;
}

.sidebar-title {
    height: 42px;
    display: flex;
    align-items: center;
    padding-left: 18px;
    font-size: 12px;
    color: #bbb;
    letter-spacing: .5px;
}

.folder {
    padding: 8px 14px;
    font-size: 13px;
    color: #ddd;
}

.file {
    height: 30px;
    display: flex;
    align-items: center;
    padding-left: 28px;
    gap: 7px;
    cursor: pointer;
}

.file:hover {
    background: #2a2d2e;
}

.file.active {
    background: #37373d;
    color: white;
}

.html-icon {
    color: #e44d26;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* TOP */
.topbar {
    height: 36px;
    background: #252526;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #181818;
}

.tab {
    height: 36px;
    min-width: 150px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1e1e1e;
    border-right: 1px solid #2b2b2b;
    font-size: 13px;
}

.tab .close {
    margin-left: auto;
    color: #999;
}

/* TOOLBAR */
.toolbar {
    height: 42px;
    background: #252526;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
}

button {
    border: none;
    cursor: pointer;
}

.run {
    background: #16825d;
    color: white;
    padding: 7px 14px;
    border-radius: 4px;
    font-size: 13px;
}

.run:hover {
    background: #1b9b6f;
}

.clear {
    background: #3a3d41;
    color: #ddd;
    padding: 7px 12px;
    border-radius: 4px;
}

.toolbar-info {
    margin-left: auto;
    color: #777;
    font-size: 12px;
}

/* WORKSPACE */
.workspace {
    flex: 1;
    display: flex;
    min-height: 0;
}

.editor-area {
    width: 58%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
}

.preview-area {
    flex: 1;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    border-left: 1px solid #333;
}

.panel-title {
    height: 30px;
    background: #252526;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 12px;
    color: #aaa;
    border-bottom: 1px solid #333;
}

#editor {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: 100%;
}

/* PREVIEW */
#preview {
    width: 100%;
    height: 100%;
    border: none;
    background: white;
}

/* STATUS */
.statusbar {
    height: 22px;
    background: #007acc;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 10px;
    font-size: 11px;
}

.status-right {
    margin-left: auto;
    display: flex;
    gap: 18px;
}
</style>

</head>

<body>

</div>

<!-- MONACO -->

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

<script>

let editor = null;

/* =========================
   CHẠY HTML
========================= */

function runCode() {

    if (!editor) {
        console.log("Editor chưa sẵn sàng");
        return;
    }

    const code = editor.getValue();

    const preview = document.getElementById("preview");

    preview.srcdoc = code;
}


/* =========================
   XÓA PREVIEW
========================= */

function clearPreview() {

    const preview = document.getElementById("preview");

    preview.srcdoc = "";

}


/* =========================
   MONACO
========================= */

require.config({
    paths: {
        vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs"
    }
});


require(["vs/editor/editor.main"], function () {

    const defaultCode =
`<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>WebCode Studio</title>

    <style>

        body {
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: cyan;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <h1>Hello World!</h1>

    <p>Đây là WebCode Studio 😎</p>

    <button onclick="hello()">
        Click me
    </button>

    <script>
        function hello() {
            alert("Hello cậu!");
        }
    <\/script>

</body>

</html>`;


    /* Tạo editor */

    editor = monaco.editor.create(
        document.getElementById("editor"),
        {

            value: defaultCode,

            language: "html",

            theme: "vs-dark",

            automaticLayout: true,

            fontSize: 14,

            fontFamily:
                "Consolas, 'Courier New', monospace",

            tabSize: 4,

            insertSpaces: true,

            minimap: {
                enabled: true
            },

            wordWrap: "off",

            quickSuggestions: true,

            suggestOnTriggerCharacters: true,

            parameterHints: {
                enabled: true
            },

            autoClosingBrackets: "always",

            autoClosingQuotes: "always",

            autoIndent: "full",

            bracketPairColorization: {
                enabled: true
            },

            scrollbar: {
                verticalScrollbarSize: 12,
                horizontalScrollbarSize: 12
            }

        }
    );


    /* =========================
       CTRL + ENTER
    ========================= */

    editor.addCommand(
        monaco.KeyMod.Ctrl |
        monaco.KeyCode.Enter,

        function () {
            runCode();
        }
    );


    /* =========================
       HTML AUTOCOMPLETE
    ========================= */

    monaco.languages.registerCompletionItemProvider(
        "html",
        {

            triggerCharacters: ["<", " "],

            provideCompletionItems:
                function(model, position) {

                    const items = [

                        ["div", "<div>$0</div>"],

                        ["span", "<span>$0</span>"],

                        ["p", "<p>$0</p>"],

                        ["h1", "<h1>$0</h1>"],

                        ["h2", "<h2>$0</h2>"],

                        ["button", "<button>$0</button>"],

                        ["input",
                         "<input type=\"${1:text}\" placeholder=\"${2}\">"],

                        ["img",
                         "<img src=\"${1}\" alt=\"${2}\">"],

                        ["a",
                         "<a href=\"${1}\">$0</a>"],

                        ["ul",
                         "<ul>\\n\\t<li>$0</li>\\n</ul>"],

                        ["li",
                         "<li>$0</li>"],

                        ["form",
                         "<form>\\n\\t$0\\n</form>"],

                        ["table",
                         "<table>\\n\\t$0\\n</table>"],

                        ["script",
                         "<script>\\n\\t$0\\n<\\\\/script>"],

                        ["style",
                         "<style>\\n\\t$0\\n</style>"]

                    ];


                    return {

                        suggestions:
                            items.map(function(item) {

                                return {

                                    label: item[0],

                                    kind:
                                        monaco
                                        .languages
                                        .CompletionItemKind
                                        .Keyword,

                                    insertText: item[1],

                                    insertTextRules:
                                        monaco
                                        .languages
                                        .CompletionItemInsertTextRule
                                        .InsertAsSnippet,

                                    range: {

                                        startLineNumber:
                                            position.lineNumber,

                                        startColumn:
                                            position.column,

                                        endLineNumber:
                                            position.lineNumber,

                                        endColumn:
                                            position.column

                                    }

                                };

                            })

                    };

                }

        }
    );


    /* =========================
       CSS AUTOCOMPLETE
    ========================= */

    monaco.languages.registerCompletionItemProvider(
        "css",
        {

            triggerCharacters: [":", "-"],

            provideCompletionItems:
                function(model, position) {

                    const properties = [

                        "color",
                        "background",
                        "background-color",
                        "font-size",
                        "font-family",
                        "font-weight",
                        "width",
                        "height",
                        "margin",
                        "padding",
                        "border",
                        "border-radius",
                        "display",
                        "position",
                        "top",
                        "left",
                        "right",
                        "bottom",
                        "flex",
                        "grid",
                        "gap",
                        "justify-content",
                        "align-items",
                        "text-align",
                        "box-shadow",
                        "opacity",
                        "transform",
                        "transition"

                    ];


                    return {

                        suggestions:
                            properties.map(function(prop) {

                                return {

                                    label: prop,

                                    kind:
                                        monaco
                                        .languages
                                        .CompletionItemKind
                                        .Property,

                                    insertText:
                                        prop + ": ",

                                    range: {

                                        startLineNumber:
                                            position.lineNumber,

                                        startColumn:
                                            position.column,

                                        endLineNumber:
                                            position.lineNumber,

                                        endColumn:
                                            position.column

                                    }

                                };

                            })

                    };

                }

        }
    );


    /* =========================
       JAVASCRIPT AUTOCOMPLETE
    ========================= */

    monaco.languages.registerCompletionItemProvider(
        "javascript",
        {

            triggerCharacters: [".", " "],

            provideCompletionItems:
                function(model, position) {

                    const items = [

                        "console.log",

                        "document",

                        "document.querySelector",

                        "document.getElementById",

                        "addEventListener",

                        "function",

                        "const",

                        "let",

                        "var",

                        "alert",

                        "setTimeout",

                        "setInterval"

                    ];


                    return {

                        suggestions:
                            items.map(function(item) {

                                return {

                                    label: item,

                                    kind:
                                        monaco
                                        .languages
                                        .CompletionItemKind
                                        .Function,

                                    insertText: item,

                                    range: {

                                        startLineNumber:
                                            position.lineNumber,

                                        startColumn:
                                            position.column,

                                        endLineNumber:
                                            position.lineNumber,

                                        endColumn:
                                            position.column

                                    }

                                };

                            })

                    };

                }

        }
    );


    /* Chạy code mặc định */

    runCode();

});

</script>

</body>
</html>
